name: GS Fast Controller Candidate

on:
  push:
    branches:
      - automation/gs-two-tier-control-v1
    paths:
      - '.project-control/**'
      - '.github/workflows/gs-fast-controller-candidate.yml'
  pull_request:
    paths:
      - '.project-control/**'
      - '.github/workflows/gs-fast-controller-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic control matrix
        run: python -m unittest discover -s .project-control/tests -v
