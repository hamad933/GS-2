name: Lockfile Bootstrap

on:
  push:
    branches:
      - chore/gs-vis-qa-001

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tooling branch
        uses: actions/checkout@v4
        with:
          ref: chore/gs-vis-qa-001

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(visual): refresh Playwright lockfile"
          git push origin HEAD:chore/gs-vis-qa-001
