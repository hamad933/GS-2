name: GS Deep Rem Exact-Head Validation

on:
  push:
    branches:
      - governance/gs-deep-rem-exact-head-validation-r1
    paths:
      - .github/workflows/gs-deep-rem-exact-head-validation.yml
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches:
      - governance/gs-deep-review-w08-c-current-baseline
    paths:
      - .github/workflows/gs-deep-rem-exact-head-validation.yml

permissions:
  contents: read
  actions: read

jobs:
  observe_push:
    name: Observe matching push validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate SHA-matching push run
        shell: bash
        env:
          OBSERVED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${OBSERVED_HEAD}&event=push&per_page=50"
          for _ in $(seq 1 10); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api")"
            match="$(printf '%s' "$json" | jq -r --arg sha "$OBSERVED_HEAD" '.workflow_runs[] | select(.name == "GS Deep Rem Exact-Head Validation" and .head_sha == $sha and .event == "push") | [.id, .status, (.conclusion // "pending"), .head_sha, .html_url] | @tsv' | head -n 1)"
            if [[ -n "$match" ]]; then
              echo "matching_push_run=$match"
              exit 0
            fi
            sleep 2
          done
          echo "Matching push validation run was not observed for ${OBSERVED_HEAD}" >&2
          exit 1

  validate:
    name: ${{ matrix.label }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: home-a
            label: W12-R3 HOME-A exact 8e975e8
            candidate_sha: 8e975e8082bff4143f283da2f2e9cd8a1caa7d30
            parent_sha: 5acba33a23c3424dbdfbfd5ef8bc94a6f7fe494a
            evidence_dir: /tmp/gs-w12-r3-home-a
            artifact_prefix: gs-w12-r3-home-a
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      CANDIDATE_SHA: ${{ matrix.candidate_sha }}
      PARENT_SHA: ${{ matrix.parent_sha }}
      EVIDENCE_DIR: ${{ matrix.evidence_dir }}
      JOB_NAME: ${{ matrix.label }}

    steps:
      - name: Check out exact pinned candidate
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity ancestry path boundary and diff
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/reports" "$EVIDENCE_DIR/screenshots"
          {
            echo "project=General Solutions"
            echo "project_id=GS"
            echo "classification=REFERENCE_ONLY"
            echo "workstream=GS-GOV-W12-DEEP-REM-EXACT-HEAD-VALIDATION-R1"
            echo "follow_on=W12-R3_HOME_A_ONLY"
            echo "candidate_key=$CANDIDATE_KEY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_key=$GITHUB_JOB"
            echo "viewports=1440,768,430,390"
            echo "home_b_executed=NO"
            echo "rp_executed=NO"
          } | tee "$EVIDENCE_DIR/identity.txt"

          test "$CANDIDATE_KEY" = "home-a"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$PARENT_SHA" "$CANDIDATE_SHA")" = "$PARENT_SHA"
          read -r behind ahead < <(git rev-list --left-right --count "$PARENT_SHA...$CANDIDATE_SHA")
          printf 'behind=%s\nahead=%s\n' "$behind" "$ahead" | tee "$EVIDENCE_DIR/ahead-behind.txt"
          test "$behind" -eq 0
          test "$ahead" -gt 0

          cat > "$EVIDENCE_DIR/expected-paths.txt" <<'EOF'
          src/components/hero/LivingSystemHero.tsx
          src/components/sections/SolutionsUniverse.tsx
          tests/visual/home-public-routing/home-deep-r1-a.spec.ts
          tests/visual/home-public-routing/home-public-routing.spec.ts
          EOF
          sed -i 's/^          //' "$EVIDENCE_DIR/expected-paths.txt"
          sort -o "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/expected-paths.txt"
          git diff --name-only "$PARENT_SHA...$CANDIDATE_SHA" | sort | tee "$EVIDENCE_DIR/actual-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/actual-paths.txt" | tee "$EVIDENCE_DIR/path-boundary.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-paths.txt" | tr -d ' ')" -eq 4
          git diff --stat "$PARENT_SHA...$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --check "$PARENT_SHA...$CANDIDATE_SHA" 2>&1 | tee "$EVIDENCE_DIR/logs/git-diff-check.log"

      - name: Set up Node 20
        id: node
        if: steps.gate.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        id: npm_ci
        if: steps.node.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/logs/npm-ci.log"

      - name: Record dependency-security signal without remediation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE_DIR/logs/npm-ci.log" ]] && grep -Eqi 'vulnerabilit|npm audit' "$EVIDENCE_DIR/logs/npm-ci.log"; then
            echo 'dependency_security_signal=REPORTED_BY_NPM_CI' | tee "$EVIDENCE_DIR/dependency-security-signal.txt"
            grep -Ei 'vulnerabilit|npm audit' "$EVIDENCE_DIR/logs/npm-ci.log" | tail -n 20 >> "$EVIDENCE_DIR/dependency-security-signal.txt" || true
          else
            echo 'dependency_security_signal=NOT_REPORTED_BY_NPM_CI_OUTPUT' | tee "$EVIDENCE_DIR/dependency-security-signal.txt"
          fi
          echo 'dependency_remediation=OUT_OF_SCOPE_NOT_PERFORMED' >> "$EVIDENCE_DIR/dependency-security-signal.txt"

      - name: Lint
        id: lint
        if: always() && steps.npm_ci.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$EVIDENCE_DIR/logs/lint.log"

      - name: Typecheck
        id: typecheck
        if: always() && steps.npm_ci.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/typecheck.log"

      - name: Build
        id: build
        if: always() && steps.npm_ci.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build.log"

      - name: Install deterministic Chromium
        id: chromium
        if: always() && steps.npm_ci.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/logs/playwright-install.log"

      - name: Run HOME-A targeted suite
        id: targeted
        if: always() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        shell: bash
        run: |
          set +e
          npx playwright test tests/visual/home-public-routing/home-deep-r1-a.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --reporter=json > "$EVIDENCE_DIR/reports/home-a-targeted.json" 2> "$EVIDENCE_DIR/logs/home-a-targeted.stderr.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/reports/targeted.exit"
          exit "$rc"

      - name: Run shared HOME routing suite
        id: home_regression
        if: always() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        shell: bash
        run: |
          set +e
          npx playwright test tests/visual/home-public-routing/home-public-routing.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --reporter=json > "$EVIDENCE_DIR/reports/home-routing.json" 2> "$EVIDENCE_DIR/logs/home-routing.stderr.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/reports/home-routing.exit"
          exit "$rc"

      - name: Run public-site integration suite
        id: public_regression
        if: always() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        shell: bash
        run: |
          set +e
          npx playwright test tests/visual/public-site.integration.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --reporter=json > "$EVIDENCE_DIR/reports/public-site-integration.json" 2> "$EVIDENCE_DIR/logs/public-site-integration.stderr.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/reports/public-site-integration.exit"
          exit "$rc"

      - name: Capture exact-head rendered evidence
        id: capture
        if: always() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4191 --strictPort > "$EVIDENCE_DIR/logs/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4191/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" -eq 1

          cat > "$RUNNER_TEMP/gs-w12-r3-home-a-capture.cjs" <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');

          const out = process.env.EVIDENCE_DIR;
          const root = 'http://127.0.0.1:4191';
          const widths = [1440, 768, 430, 390];
          const inventory = [];
          const reports = [];
          const failures = [];
          const observations = [];

          const addFailure = (width, label, detail) => failures.push({ width, label, detail: String(detail) });
          const observe = (width, label, value) => observations.push({ width, label, value });
          const check = (width, label, condition, detail = '') => {
            observe(width, label, { pass: Boolean(condition), detail });
            if (!condition) addFailure(width, label, detail || 'check failed');
          };

          function parseCssTimeListMilliseconds(value) {
            return value.split(',').map((token) => {
              const match = token.trim().match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?)\s*(ms|s)$/i);
              if (!match) throw new Error(`Unsupported CSS time value: ${token}`);
              const numericValue = Number(match[1]);
              if (!Number.isFinite(numericValue)) throw new Error(`Invalid CSS time value: ${token}`);
              return match[2].toLowerCase() === 's' ? numericValue * 1000 : numericValue;
            });
          }

          const fileFor = (width, name) => path.join(out, 'screenshots', `home-a-${width}-${name}.png`);
          async function shot(locator, width, name) {
            const file = fileFor(width, name);
            await locator.screenshot({ path: file, animations: 'disabled' });
            inventory.push(path.basename(file));
          }

          async function commonRuntime(page, width, consoleErrors, pageErrors) {
            const dims = await page.evaluate(() => ({
              client: document.documentElement.clientWidth,
              scroll: document.documentElement.scrollWidth,
            }));
            check(width, 'document-no-horizontal-overflow', dims.scroll <= dims.client + 1, `${dims.scroll}/${dims.client}`);
            check(width, 'zero-console-errors', consoleErrors.length === 0, JSON.stringify(consoleErrors));
            check(width, 'zero-page-errors', pageErrors.length === 0, JSON.stringify(pageErrors));
            return dims;
          }

          async function captureHomeA(page, width) {
            await page.goto(`${root}/`);
            await page.evaluate(() => document.fonts.ready);
            check(width, 'rtl', (await page.locator('html').getAttribute('dir')) === 'rtl');
            const hero = page.locator('#hero');
            await shot(hero, width, 'hero-need');

            const need = hero.getByRole('button', { name: 'إطلاق خدمة رقمية', exact: true });
            await need.focus();
            await need.press('Enter');
            const direction = hero.getByRole('button', { name: 'خطوة رئيسية واحدة' });
            check(width, 'direction-focus-transfer', await direction.evaluate(el => el === document.activeElement));
            await shot(hero, width, 'hero-direction');

            await direction.press('Enter');
            const arrange = hero.getByRole('button', { name: 'رتّب الرحلة حول الهدف', exact: true });
            check(width, 'build-focus-transfer', await arrange.evaluate(el => el === document.activeElement));
            await shot(hero, width, 'hero-build');

            for (const action of ['رتّب الرحلة حول الهدف', 'وحّد التجربة', 'جرّب المسار']) {
              await hero.getByRole('button', { name: action, exact: true }).press('Enter');
            }
            const brief = hero.getByLabel('طلبك المختصر', { exact: true });
            check(width, 'brief-empty', (await brief.inputValue()) === '');
            check(width, 'brief-focus-transfer', await brief.evaluate(el => el === document.activeElement));
            await shot(hero, width, 'hero-brief-empty');
            await brief.fill('أحتاج تبسيط رحلة التسجيل');
            await shot(hero, width, 'hero-brief-user-authored');
            await page.keyboard.press('Tab');
            await hero.getByRole('button', { name: 'جهّز الملخّص', exact: true }).press('Enter');
            const launch = hero.locator('.e2-launch-chamber');
            check(width, 'launch-focus-transfer', await launch.evaluate(el => el === document.activeElement));
            check(width, 'skip-link-not-focused', !(await page.locator('.skip-link').first().evaluate(el => el === document.activeElement)));
            await shot(hero, width, 'hero-launch');

            await page.goto(`${root}/`);
            await page.evaluate(() => document.fonts.ready);
            let s02 = page.locator('#solutions-universe');
            let commerce = s02.locator('.s02-station-2');
            await commerce.hover();
            check(width, 'hover-does-not-select', (await s02.getAttribute('data-active')) === 'business');
            check(width, 'preview-distinct', (await s02.getAttribute('data-preview')) === 'commerce');
            await shot(s02, width, 's02-preview-not-selected');
            await commerce.click();
            check(width, 'explicit-select', (await s02.getAttribute('data-active')) === 'commerce');
            await shot(s02, width, 's02-explicit-selected');

            if (width <= 430) {
              await page.goto(`${root}/`);
              await page.evaluate(() => document.fonts.ready);
              s02 = page.locator('#solutions-universe');
              commerce = s02.locator('.s02-station-2');

              let reached = false;
              let tabCount = 0;
              for (let index = 0; index < 160; index += 1) {
                await page.keyboard.press('Tab');
                tabCount = index + 1;
                if (await commerce.evaluate(el => el === document.activeElement)) {
                  reached = true;
                  break;
                }
              }
              check(width, 's02-keyboard-focus-reached-intended-station', reached, `tabCount=${tabCount}`);

              if (reached) {
                const focus = await commerce.evaluate(el => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  const outlineWidth = parseFloat(s.outlineWidth) || 0;
                  const outlineOffset = parseFloat(s.outlineOffset) || 0;
                  const bleed = Math.max(0, outlineWidth + outlineOffset);
                  return {
                    active: el === document.activeElement,
                    focusVisible: el.matches(':focus-visible'),
                    outlineVisible: s.outlineStyle !== 'none' && outlineWidth > 0,
                    shadowVisible: s.boxShadow !== 'none',
                    outlineStyle: s.outlineStyle,
                    outlineWidth,
                    outlineOffset,
                    boxShadow: s.boxShadow,
                    left: r.left - bleed,
                    right: r.right + bleed,
                    viewport: innerWidth,
                  };
                });
                check(width, 's02-intended-element-active', focus.active, JSON.stringify(focus));
                check(width, 's02-keyboard-focus-visible-modality', focus.focusVisible, JSON.stringify(focus));
                check(width, 's02-perceivable-focus-visible-treatment', focus.outlineVisible || focus.shadowVisible, JSON.stringify(focus));
                check(width, 's02-focus-geometry-inside-viewport', focus.left >= 0 && focus.right <= focus.viewport, JSON.stringify(focus));
                observe(width, 's02-keyboard-focus-metrics', { tabCount, ...focus });
              }
              await shot(s02, width, 's02-focus-boundary');
            }

            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`${root}/`);
            await page.evaluate(() => document.fonts.ready);
            for (const [label, selector] of [
              ['hero-threshold-light', '#hero .e2-threshold-light'],
              ['s02-connector', '#solutions-universe .s02-connector'],
            ]) {
              const raw = await page.locator(selector).first().evaluate(el => getComputedStyle(el).transitionDuration);
              const durationsMs = parseCssTimeListMilliseconds(raw);
              const detail = JSON.stringify({ selector, raw, durationsMs, thresholdMs: 0.01 });
              check(width, `reduced-motion-${label}-has-values`, durationsMs.length > 0, detail);
              check(width, `reduced-motion-${label}-finite`, durationsMs.every(Number.isFinite), detail);
              check(width, `reduced-motion-${label}-threshold`, durationsMs.every(value => value <= 0.01), detail);
              observe(width, `reduced-motion-${label}-computed`, { selector, raw, durationsMs, thresholdMs: 0.01 });
            }
          }

          (async () => {
            fs.mkdirSync(path.join(out, 'screenshots'), { recursive: true });
            const browser = await chromium.launch({ headless: true });
            for (const width of widths) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 900;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('pageerror', error => pageErrors.push(error.message));
              try {
                await captureHomeA(page, width);
              } catch (error) {
                addFailure(width, 'capture-fatal', error && error.stack ? error.stack : error);
              }
              const dims = await commonRuntime(page, width, consoleErrors, pageErrors).catch(error => {
                addFailure(width, 'runtime-summary', error);
                return null;
              });
              reports.push({ width, consoleErrors, pageErrors, document: dims });
              await context.close();
            }
            await browser.close();
            fs.writeFileSync(path.join(out, 'capture-report.json'), JSON.stringify({
              candidate: 'home-a', reports, observations, failures,
            }, null, 2));
            fs.writeFileSync(path.join(out, 'screenshots-inventory.txt'), inventory.sort().join('\n') + (inventory.length ? '\n' : ''));
            if (failures.length) {
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/gs-w12-r3-home-a-capture.cjs" 2>&1 | tee "$EVIDENCE_DIR/logs/capture.log"

      - name: Summarize evidence identity and exact results
        id: summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETED_OUTCOME: ${{ steps.targeted.outcome }}
          HOME_OUTCOME: ${{ steps.home_regression.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_regression.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node <<'NODE' | tee "$EVIDENCE_DIR/test-counts.txt"
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join(process.env.EVIDENCE_DIR, 'reports');
          if (!fs.existsSync(dir)) process.exit(0);
          for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()) {
            try {
              const report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const s = report.stats || {};
              const total = (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0) + (s.skipped || 0);
              console.log(`${file}: total=${total} expected=${s.expected ?? 'n/a'} unexpected=${s.unexpected ?? 'n/a'} flaky=${s.flaky ?? 'n/a'} skipped=${s.skipped ?? 'n/a'} duration_ms=${s.duration ?? 'n/a'}`);
            } catch (error) {
              console.log(`${file}: report_parse_error=${error.message}`);
            }
          }
          NODE

          find "$EVIDENCE_DIR/screenshots" -maxdepth 1 -type f -name '*.png' -printf 'custom/%f\n' 2>/dev/null | sort | tee "$EVIDENCE_DIR/screenshots-inventory.txt" || true
          custom_count="$(find "$EVIDENCE_DIR/screenshots" -maxdepth 1 -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
          echo "custom_screenshot_count=$custom_count" | tee "$EVIDENCE_DIR/screenshot-counts.txt"
          echo "total_screenshot_count=$custom_count" | tee -a "$EVIDENCE_DIR/screenshot-counts.txt"

          runtime_status="CAPTURE_NOT_AVAILABLE"
          console_total="UNKNOWN"
          page_total="UNKNOWN"
          if [[ -f "$EVIDENCE_DIR/capture-report.json" ]]; then
            node <<'NODE' | tee "$EVIDENCE_DIR/runtime-counts.txt"
          const r = require(process.env.EVIDENCE_DIR + '/capture-report.json');
          const consoleTotal = r.reports.reduce((sum, item) => sum + (item.consoleErrors || []).length, 0);
          const pageTotal = r.reports.reduce((sum, item) => sum + (item.pageErrors || []).length, 0);
          console.log(`console_error_total=${consoleTotal}`);
          console.log(`page_error_total=${pageTotal}`);
          NODE
            console_total="$(grep '^console_error_total=' "$EVIDENCE_DIR/runtime-counts.txt" | cut -d= -f2)"
            page_total="$(grep '^page_error_total=' "$EVIDENCE_DIR/runtime-counts.txt" | cut -d= -f2)"
            if [[ "$console_total" == "0" && "$page_total" == "0" ]]; then runtime_status="ZERO_ERRORS"; else runtime_status="ERRORS_PRESENT"; fi
            node <<'NODE' | tee "$EVIDENCE_DIR/reduced-motion-observed.txt"
          const r = require(process.env.EVIDENCE_DIR + '/capture-report.json');
          for (const item of r.observations.filter(x => x.label.startsWith('reduced-motion-') && x.label.endsWith('-computed'))) {
            const v = item.value;
            console.log(`width=${item.width} label=${item.label} raw=${JSON.stringify(v.raw)} durations_ms=${JSON.stringify(v.durationsMs)} threshold_ms=${v.thresholdMs}`);
          }
          NODE
          fi

          if [[ "$TARGETED_OUTCOME" == "success" && "$HOME_OUTCOME" == "success" && "$PUBLIC_OUTCOME" == "success" && "$CAPTURE_OUTCOME" == "success" ]]; then
            test_result="PASS"
          else
            test_result="FAIL"
          fi

          jobs_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          job_id="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$jobs_api" | jq -r --arg name "$JOB_NAME" '.jobs[] | select(.name == $name) | .id' | head -n 1)"
          [[ -n "$job_id" ]] || job_id="UNKNOWN"

          {
            echo "project=General Solutions"
            echo "project_id=GS"
            echo "workstream=GS-GOV-W12-DEEP-REM-EXACT-HEAD-VALIDATION-R1"
            echo "follow_on=W12-R3_HOME_A_ONLY"
            echo "classification=REFERENCE_ONLY"
            echo "candidate_key=$CANDIDATE_KEY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_id=$job_id"
            echo "job_name=$JOB_NAME"
            echo "viewports=1440,768,430,390"
            echo "test_result=$test_result"
            echo "targeted_test_result=$TARGETED_OUTCOME"
            echo "home_regression_result=$HOME_OUTCOME"
            echo "public_regression_result=$PUBLIC_OUTCOME"
            echo "capture_result=$CAPTURE_OUTCOME"
            echo "console_page_error_status=$runtime_status"
            echo "console_error_total=$console_total"
            echo "page_error_total=$page_total"
            echo "home_b_executed=NO"
            echo "rp_executed=NO"
          } | tee "$EVIDENCE_DIR/artifact-metadata.txt"

          {
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "gate=${{ steps.gate.outcome }}"
            echo "node=${{ steps.node.outcome }}"
            echo "npm_ci=${{ steps.npm_ci.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "chromium=${{ steps.chromium.outcome }}"
            echo "targeted=${{ steps.targeted.outcome }}"
            echo "home_regression=${{ steps.home_regression.outcome }}"
            echo "public_regression=${{ steps.public_regression.outcome }}"
            echo "capture=${{ steps.capture.outcome }}"
          } | tee "$EVIDENCE_DIR/step-outcomes.txt"

      - name: Upload HOME-A SHA-bound evidence artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ matrix.candidate_sha }}
          path: ${{ matrix.evidence_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish artifact identity
        if: always() && steps.artifact.outcome == 'success'
        shell: bash
        run: |
          {
            echo "artifact_id=${{ steps.artifact.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.artifact.outputs.artifact-digest }}"
            echo "artifact_name=${{ matrix.artifact_prefix }}-${{ matrix.candidate_sha }}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
          } | tee "$EVIDENCE_DIR/artifact-upload-output.txt"
          {
            echo "### $JOB_NAME"
            echo "- candidate: $CANDIDATE_SHA"
            echo "- artifact: ${{ matrix.artifact_prefix }}-${{ matrix.candidate_sha }}"
            echo "- artifact id: ${{ steps.artifact.outputs.artifact-id }}"
            echo "- digest: ${{ steps.artifact.outputs.artifact-digest }}"
            echo "- classification: REFERENCE_ONLY"
          } >> "$GITHUB_STEP_SUMMARY"
