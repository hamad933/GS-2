                const dims=await page.evaluate(()=>({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth})); if(dims.scroll>dims.client+1)issues.push(`${width}: horizontal overflow ${dims.scroll}/${dims.client}`); if(consoleErrors.length)issues.push(`${width}: console errors ${JSON.stringify(consoleErrors)}`); if(pageErrors.length)issues.push(`${width}: page errors ${JSON.stringify(pageErrors)}`); report.push({width,consoleErrors,pageErrors,document:dims});
