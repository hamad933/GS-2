              inventory.push(path.basename(file));
            };

            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 900;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(e.message));
              await page.goto('http://127.0.0.1:4192/');
              await page.evaluate(() => document.fonts.ready);
              if ((await page.locator('html').getAttribute('dir')) !== 'rtl') {
                throw new Error(`HOME-B ${width}: expected rtl`);
              }

              const proof = page.locator('#reference-proof');
              const rp04 = proof.locator('[data-project-selector="rp04"]');
              await rp04.click();
              if ((await proof.getAttribute('data-project')) !== 'rp04') {
                throw new Error(`HOME-B ${width}: pointer selection failed`);
              }
              await shot(proof, width, 's03-selected-rp04');

              const rp02 = proof.locator('[data-project-selector="rp02"]');
              await rp02.focus();
              if ((await proof.getAttribute('data-project')) !== 'rp04') {
                throw new Error(`HOME-B ${width}: focus-only mutated selection`);
              }
              await shot(proof, width, 's03-focus-only-no-selection');

              if (width <= 430) {
                const disclosure = proof.locator('[data-visible-evidence-boundary]');
                if (!(await disclosure.isVisible())) throw new Error(`HOME-B ${width}: disclosure missing`);
                await shot(proof, width, 's03-mobile-disclosure');
              }

              const gateway = page.locator('#project-gateway');
              await shot(gateway, width, 'gateway-cta-composition');

              const footer = page.locator('.gs-footer');
              const primaryCount = await footer.getByRole('link', { name: 'ابدأ اختيارك', exact: true }).count();
              const secondaryCount = await footer.getByRole('link', { name: 'انتقل إلى نقطة البدء', exact: true }).count();
              if (primaryCount !== 1 || secondaryCount !== 1) {
                throw new Error(`HOME-B ${width}: footer CTA distinction failed`);
              }
              await shot(footer, width, 'footer-cta-distinction');

              const dims = await page.evaluate(() => ({
                client: document.documentElement.clientWidth,
                scroll: document.documentElement.scrollWidth,
              }));
              if (dims.scroll > dims.client + 1) throw new Error(`HOME-B ${width}: horizontal overflow ${dims.scroll}/${dims.client}`);
              if (consoleErrors.length || pageErrors.length) {
                throw new Error(`HOME-B ${width}: runtime errors console=${JSON.stringify(consoleErrors)} page=${JSON.stringify(pageErrors)}`);
              }
              report.push({ width, consoleErrors, pageErrors, document: dims });
              await context.close();
            }

            fs.writeFileSync(path.join(out, 'capture-report.json'), JSON.stringify(report, null, 2));
            fs.writeFileSync(path.join(out, 'screenshots-inventory.txt'), inventory.join('\n') + '\n');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          node "$RUNNER_TEMP/capture-home-b.cjs" 2>&1 | tee "$EVIDENCE_DIR/logs/capture.log"

      - name: Summarize HOME-B evidence and test counts
