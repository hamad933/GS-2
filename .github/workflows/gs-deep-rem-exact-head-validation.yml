            > "$EVIDENCE_DIR/reports/reference-projects-targeted.json" 2> "$EVIDENCE_DIR/logs/reference-projects-targeted.stderr.log"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE_DIR/reports/reference-projects-targeted.exit"
          if [[ -d "$RP_NATIVE_EVIDENCE" ]]; then cp -a "$RP_NATIVE_EVIDENCE"/. "$EVIDENCE_DIR/repo-native"/; fi
