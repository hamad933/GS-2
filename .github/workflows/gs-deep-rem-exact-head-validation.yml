                const rp02=proof.locator('[data-project-selector="rp02"]'); await rp02.focus(); if((await proof.getAttribute('data-project'))!=='rp04')issues.push(`${width}: focus-only mutated selection`); await shot(proof,width,'s03-focus-only-no-selection'); await rp02.press('Enter'); await shot(proof,width,'s03-enter-selected-rp02');
                if(width<=430){const disclosure=proof.locator('[data-visible-evidence-boundary]'); if(!(await disclosure.isVisible()))issues.push(`${width}: mobile disclosure missing`); else await shot(proof,width,'s03-mobile-disclosure');}
                await shot(page.locator('#project-gateway'),width,'gateway-cta-composition');
