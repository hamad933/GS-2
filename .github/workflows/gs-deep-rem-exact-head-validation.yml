            echo "public_regression=${{ steps.public_regression.outcome }}"
            echo "capture=${{ steps.capture.outcome }}"
          } | tee "$EVIDENCE_DIR/step-outcomes.txt"

      - name: Upload HOME-B SHA-bound evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-w12-home-b-014422a8939270115a5474c4c3e423a39bc51047
          path: /tmp/gs-w12-home-b
          if-no-files-found: error
          retention-days: 14

      - name: Enforce truthful HOME-B result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          statuses=(
            "${{ steps.checkout.outcome }}"
            "${{ steps.gate.outcome }}"
            "${{ steps.node.outcome }}"
            "${{ steps.npm_ci.outcome }}"
            "${{ steps.lint.outcome }}"
            "${{ steps.typecheck.outcome }}"
            "${{ steps.build.outcome }}"
            "${{ steps.chromium.outcome }}"
            "${{ steps.targeted.outcome }}"
            "${{ steps.home_regression.outcome }}"
            "${{ steps.public_regression.outcome }}"
            "${{ steps.capture.outcome }}"
            "${{ steps.artifact.outcome }}"
          )
          printf '%s\n' "${statuses[@]}"
          for status in "${statuses[@]}"; do test "$status" = "success"; done

  reference_projects:
    name: Reference Projects exact d8fdac6
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: d8fdac6fc032cd8ad77482247ecce9bcd4f30a3a
      PARENT_SHA: bef381bcebde8199f263e1be465c5b0010058f5d
      EVIDENCE_DIR: /tmp/gs-w12-rp
    steps:
      - name: Check out exact Reference Projects candidate
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: d8fdac6fc032cd8ad77482247ecce9bcd4f30a3a
          fetch-depth: 0
          persist-credentials: false

      - name: Verify RP identity ancestry path boundary and diff
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/reports" "$EVIDENCE_DIR/screenshots"
          {
            echo "classification=REFERENCE_ONLY"
            echo "workstream=GS-GOV-W12-DEEP-REM-EXACT-HEAD-VALIDATION-R1"
            echo "candidate=REFERENCE_PROJECTS"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
          } | tee "$EVIDENCE_DIR/identity.txt"

          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$PARENT_SHA" "$CANDIDATE_SHA")" = "$PARENT_SHA"
          read -r behind ahead < <(git rev-list --left-right --count "$PARENT_SHA...$CANDIDATE_SHA")
          {
            echo "behind=$behind"
            echo "ahead=$ahead"
          } | tee "$EVIDENCE_DIR/ahead-behind.txt"
          test "$behind" -eq 0
          test "$ahead" -gt 0

          cat > "$EVIDENCE_DIR/expected-paths.txt" <<'EOF'
          src/features/reference-projects/ReferenceProjectsBody.tsx
          tests/visual/reference-projects/reference-projects.visual.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/expected-paths.txt"
          git diff --name-only "$PARENT_SHA...$CANDIDATE_SHA" | sort | tee "$EVIDENCE_DIR/actual-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/actual-paths.txt" | tee "$EVIDENCE_DIR/path-boundary.diff"
          git diff --stat "$PARENT_SHA...$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --check "$PARENT_SHA...$CANDIDATE_SHA" 2>&1 | tee "$EVIDENCE_DIR/logs/git-diff-check.log"

      - name: Set up Node 20 for RP
        id: node
        if: steps.gate.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci RP
        id: npm_ci
        if: steps.node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/logs/npm-ci.log"

      - name: Lint RP
        id: lint
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$EVIDENCE_DIR/logs/lint.log"

      - name: Typecheck RP
        id: typecheck
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/typecheck.log"

      - name: Build RP
        id: build
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build.log"

      - name: Install Chromium RP
        id: chromium
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/logs/playwright-install.log"

      - name: Run complete targeted Reference Projects suite
        id: targeted
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RP_NATIVE_EVIDENCE: tests/visual/reference-projects/evidence
        run: |
          rm -rf "$RP_NATIVE_EVIDENCE"
          set +e
          npx playwright test \
            tests/visual/reference-projects/reference-projects.visual.spec.ts \
            --config=tests/visual/reference-projects/playwright.config.ts \
            --project=chromium \
            --workers=1 \
            --reporter=json \
            > "$EVIDENCE_DIR/reports/reference-projects-targeted.json" \
            2> "$EVIDENCE_DIR/logs/reference-projects-targeted.stderr.log"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE_DIR/reports/reference-projects-targeted.exit"
          mkdir -p "$EVIDENCE_DIR/repo-native"
          if [[ -d "$RP_NATIVE_EVIDENCE" ]]; then
            cp -a "$RP_NATIVE_EVIDENCE"/. "$EVIDENCE_DIR/repo-native"/
          fi
          exit "$rc"

      - name: Capture RP selected ledger comparison and selector evidence
        id: capture
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4193 --strictPort > "$EVIDENCE_DIR/logs/dev-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4193/tests/visual/fixtures/reference-projects/index.html >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" -eq 1

          cat > "$RUNNER_TEMP/capture-rp.cjs" <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');

          (async () => {
            const out = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const inventory = [];
            const report = [];
            const base = 'http://127.0.0.1:4193/tests/visual/fixtures/reference-projects/index.html?locale=ar';

            const shot = async (locator, width, name, fullPage = false) => {
              const file = path.join(out, 'screenshots', `rp-${width}-${name}.png`);
              if (fullPage) await locator.page().screenshot({ path: file, fullPage: true, animations: 'disabled' });
              else await locator.screenshot({ path: file, animations: 'disabled' });
              inventory.push(path.basename(file));
            };

            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 900;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(e.message));

              await page.goto(base);
              await page.evaluate(() => document.fonts.ready);
              const body = page.locator('.reference-projects-body');
              if ((await body.getAttribute('dir')) !== 'rtl') throw new Error(`RP ${width}: rtl missing`);

              const selector = page.locator('.rp-project-selector');
              const expectedOrientation = width <= 900 ? 'horizontal' : 'vertical';
              if ((await selector.getAttribute('aria-orientation')) !== expectedOrientation) {
                throw new Error(`RP ${width}: selector orientation mismatch`);
              }

              await page.locator('[data-project-selector="rp02"]').click();
              if ((await body.getAttribute('data-active-project')) !== 'rp02') throw new Error(`RP ${width}: rp02 selection failed`);
              await shot(body, width, 'selected-rp02', true);

              await page.locator('[data-project-selector="rp04"]').click();
              await page.getByRole('button', { name: /سجل الحدود والتحقق/ }).click();
              if ((await page.locator('.rp-ledger').getAttribute('class') || '').includes('is-open') === false) {
                throw new Error(`RP ${width}: ledger did not expand`);
              }
              await shot(body, width, 'expanded-ledger-rp04', true);

              await shot(page.locator('.rp-comparison'), width, 'comparison-programmatic-rows');

              await page.goto(base);
              await page.evaluate(() => document.fonts.ready);
              const first = page.locator('[data-project-selector="rp01"]');
              await first.focus();
              if (width <= 900) await page.keyboard.press('ArrowLeft');
              else await page.keyboard.press('ArrowDown');
              await shot(page.locator('.rp-project-selector'), width, 'responsive-selector-keyboard');

              const publicText = await page.locator('.reference-projects-body').innerText();
              for (const forbidden of ['REFERENCE_ONLY', 'UNAVAILABLE', 'ROUTE_NOT_CONFIGURED', 'GS-PUB-003', 'repository', 'المستودع']) {
                if (publicText.toLowerCase().includes(forbidden.toLowerCase())) {
                  throw new Error(`RP ${width}: visible forbidden token ${forbidden}`);
                }
              }
              if (!publicText.includes('المسار الخارجي الموثوق غير متاح حاليًا')) {
                throw new Error(`RP ${width}: truthful unavailable route missing`);
              }

              const dims = await page.evaluate(() => ({
                client: document.documentElement.clientWidth,
                scroll: document.documentElement.scrollWidth,
              }));
              if (dims.scroll > dims.client + 1) throw new Error(`RP ${width}: horizontal overflow ${dims.scroll}/${dims.client}`);
              if (consoleErrors.length || pageErrors.length) {
                throw new Error(`RP ${width}: runtime errors console=${JSON.stringify(consoleErrors)} page=${JSON.stringify(pageErrors)}`);
              }
              report.push({ width, orientation: expectedOrientation, consoleErrors, pageErrors, document: dims });
              await context.close();
            }

            fs.writeFileSync(path.join(out, 'capture-report.json'), JSON.stringify(report, null, 2));
            fs.writeFileSync(path.join(out, 'screenshots-inventory.txt'), inventory.join('\n') + '\n');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          node "$RUNNER_TEMP/capture-rp.cjs" 2>&1 | tee "$EVIDENCE_DIR/logs/capture.log"

      - name: Summarize RP evidence and test counts
        if: always()
        shell: bash
        run: |
