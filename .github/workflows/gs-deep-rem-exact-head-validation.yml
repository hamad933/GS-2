          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node "$GITHUB_WORKSPACE/.gs-w12-home-b-capture.cjs" 2>&1 | tee "$EVIDENCE_DIR/logs/capture.log"

      - name: Summarize HOME-B evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          node <<'NODE' | tee "$EVIDENCE_DIR/test-counts.txt"
