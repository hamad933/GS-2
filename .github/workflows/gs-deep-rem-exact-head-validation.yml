            const shot=async(locator,width,name,full=false)=>{const file=path.join(out,'screenshots',`rp-${width}-${name}.png`); if(full)await locator.page().screenshot({path:file,fullPage:true,animations:'disabled'});else await locator.screenshot({path:file,animations:'disabled'});inventory.push(path.basename(file))};
            for(const width of [1440,768,430,390]){const height=width===768?1024:width<=430?844:900,context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),consoleErrors=[],pageErrors=[];page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('pageerror',e=>pageErrors.push(e.message));
              try{await page.goto(base);await page.evaluate(()=>document.fonts.ready);const body=page.locator('.reference-projects-body'),selector=page.locator('.rp-project-selector'),orientation=width<=900?'horizontal':'vertical';if((await body.getAttribute('dir'))!=='rtl')issues.push(`${width}: body dir is not rtl`);if((await selector.getAttribute('aria-orientation'))!==orientation)issues.push(`${width}: selector orientation mismatch`);
                await page.locator('[data-project-selector="rp02"]').click();await shot(body,width,'selected-rp02',true);await page.locator('[data-project-selector="rp04"]').click();await page.getByRole('button',{name:/سجل الحدود والتحقق/}).click();await shot(body,width,'expanded-ledger-rp04',true);await shot(page.locator('.rp-comparison'),width,'comparison-programmatic-rows');
                await page.goto(base);await page.evaluate(()=>document.fonts.ready);const first=page.locator('[data-project-selector="rp01"]');await first.focus();await page.keyboard.press(width<=900?'ArrowLeft':'ArrowDown');await shot(page.locator('.rp-project-selector'),width,'responsive-selector-keyboard');
                const text=await page.locator('.reference-projects-body').innerText();for(const forbidden of ['REFERENCE_ONLY','UNAVAILABLE','ROUTE_NOT_CONFIGURED','GS-PUB-003','repository','المستودع'])if(text.toLowerCase().includes(forbidden.toLowerCase()))issues.push(`${width}: visible forbidden token ${forbidden}`);if(!text.includes('المسار الخارجي الموثوق غير متاح حاليًا'))issues.push(`${width}: truthful unavailable route missing`);
                const dims=await page.evaluate(()=>({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth}));if(dims.scroll>dims.client+1)issues.push(`${width}: horizontal overflow ${dims.scroll}/${dims.client}`);if(consoleErrors.length)issues.push(`${width}: console errors ${JSON.stringify(consoleErrors)}`);if(pageErrors.length)issues.push(`${width}: page errors ${JSON.stringify(pageErrors)}`);report.push({width,orientation,consoleErrors,pageErrors,document:dims});
              }catch(error){issues.push(`${width}: capture exception ${error.message}`)}finally{await context.close()}}
            fs.writeFileSync(path.join(out,'capture-report.json'),JSON.stringify({report,issues},null,2));fs.writeFileSync(path.join(out,'screenshots-inventory.txt'),inventory.join('\n')+'\n');await browser.close();if(issues.length){console.error(issues.join('\n'));process.exit(1)}})().catch(e=>{console.error(e);process.exit(1)});
