name: GS Deep Rem Exact-Head Validation

on:
  push:
    branches:
      - governance/gs-deep-rem-exact-head-validation-r1
    paths:
      - .github/workflows/gs-deep-rem-exact-head-validation.yml
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches:
      - governance/gs-deep-review-w08-c-current-baseline
    paths:
      - .github/workflows/gs-deep-rem-exact-head-validation.yml

permissions:
  contents: read
  actions: read

jobs:
  observe_push:
    name: Observe matching push validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate SHA-matching push run
        shell: bash
        env:
          OBSERVED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${OBSERVED_HEAD}&event=push&per_page=50"
          for _ in $(seq 1 10); do
            json="$(curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               "$api")"
            match="$(printf '%s' "$json" | jq -r --arg sha "$OBSERVED_HEAD"               '.workflow_runs[] | select(.name == "GS Deep Rem Exact-Head Validation" and .head_sha == $sha and .event == "push") | [.id, .status, (.conclusion // "pending"), .head_sha, .html_url] | @tsv'               | head -n 1)"
            if [[ -n "$match" ]]; then
              echo "matching_push_run=$match"
              exit 0
            fi
            sleep 2
          done
          echo "Matching push validation run was not observed for ${OBSERVED_HEAD}" >&2
          exit 1

  home_a:
    name: HOME-A exact 055a908
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: 055a908af7720373f086c889fc93d75c2b7c8568
      PARENT_SHA: 5acba33a23c3424dbdfbfd5ef8bc94a6f7fe494a
      EVIDENCE_DIR: /tmp/gs-w12-home-a
    steps:
      - name: Check out exact HOME-A candidate
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: 055a908af7720373f086c889fc93d75c2b7c8568
          fetch-depth: 0
          persist-credentials: false

      - name: Verify HOME-A identity ancestry path boundary and diff
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/reports" "$EVIDENCE_DIR/screenshots"
          {
            echo "classification=REFERENCE_ONLY"
            echo "workstream=GS-GOV-W12-DEEP-REM-EXACT-HEAD-VALIDATION-R1"
            echo "candidate=HOME-A"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
          } | tee "$EVIDENCE_DIR/identity.txt"

          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$PARENT_SHA" "$CANDIDATE_SHA")" = "$PARENT_SHA"

          read -r behind ahead < <(git rev-list --left-right --count "$PARENT_SHA...$CANDIDATE_SHA")
          {
            echo "behind=$behind"
            echo "ahead=$ahead"
          } | tee "$EVIDENCE_DIR/ahead-behind.txt"
          test "$behind" -eq 0
          test "$ahead" -gt 0

          cat > "$EVIDENCE_DIR/expected-paths.txt" <<'EOF'
          src/components/hero/LivingSystemHero.tsx
          src/components/sections/SolutionsUniverse.tsx
          tests/visual/home-public-routing/home-deep-r1-a.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/expected-paths.txt"
          git diff --name-only "$PARENT_SHA...$CANDIDATE_SHA" | sort | tee "$EVIDENCE_DIR/actual-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/actual-paths.txt" | tee "$EVIDENCE_DIR/path-boundary.diff"
          git diff --stat "$PARENT_SHA...$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --check "$PARENT_SHA...$CANDIDATE_SHA" 2>&1 | tee "$EVIDENCE_DIR/logs/git-diff-check.log"

      - name: Set up Node 20 for HOME-A
        id: node
        if: steps.gate.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci HOME-A
        id: npm_ci
        if: steps.node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/logs/npm-ci.log"

      - name: Lint HOME-A
        id: lint
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$EVIDENCE_DIR/logs/lint.log"

      - name: Typecheck HOME-A
        id: typecheck
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/typecheck.log"

      - name: Build HOME-A
        id: build
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build.log"

      - name: Install Chromium HOME-A
        id: chromium
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/logs/playwright-install.log"

      - name: Run HOME-A dedicated exact-head suite
        id: targeted
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test \
            tests/visual/home-public-routing/home-deep-r1-a.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1 \
            --reporter=json \
            > "$EVIDENCE_DIR/reports/home-a-targeted.json" \
            2> "$EVIDENCE_DIR/logs/home-a-targeted.stderr.log"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE_DIR/reports/home-a-targeted.exit"
          exit "$rc"

      - name: Run HOME existing routing regression
        id: home_regression
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test \
            tests/visual/home-public-routing/home-public-routing.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1 \
            --reporter=json \
            > "$EVIDENCE_DIR/reports/home-routing.json" \
            2> "$EVIDENCE_DIR/logs/home-routing.stderr.log"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE_DIR/reports/home-routing.exit"
          exit "$rc"

      - name: Run HOME public-site integration regression
        id: public_regression
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test \
            tests/visual/public-site.integration.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1 \
            --reporter=json \
            > "$EVIDENCE_DIR/reports/public-site-integration.json" \
            2> "$EVIDENCE_DIR/logs/public-site-integration.stderr.log"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE_DIR/reports/public-site-integration.exit"
          exit "$rc"

      - name: Capture HOME-A exact rendered evidence
        id: capture
        if: steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4191 --strictPort > "$EVIDENCE_DIR/logs/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4191/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" -eq 1

          cat > "$RUNNER_TEMP/capture-home-a.cjs" <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');

          (async () => {
            const out = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const inventory = [];
            const report = [];

            const shot = async (locator, width, name) => {
              const file = path.join(out, 'screenshots', `home-a-${width}-${name}.png`);
              await locator.screenshot({ path: file, animations: 'disabled' });
              inventory.push(path.basename(file));
            };

            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 900;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(e.message));

              await page.goto('http://127.0.0.1:4191/');
              await page.evaluate(() => document.fonts.ready);
              const htmlDir = await page.locator('html').getAttribute('dir');
              if (htmlDir !== 'rtl') throw new Error(`HOME-A ${width}: expected rtl, got ${htmlDir}`);

              const hero = page.locator('#hero');
              await hero.getByRole('button', { name: 'إطلاق خدمة رقمية', exact: true }).click();
              const direction = hero.getByRole('button', { name: 'خطوة رئيسية واحدة' });
              if (!(await direction.evaluate(el => el === document.activeElement))) {
                throw new Error(`HOME-A ${width}: direction focus continuity failed`);
              }
              await shot(hero, width, 'hero-direction-focus');

              await direction.press('Enter');
              const buildAction = hero.getByRole('button', { name: 'رتّب الرحلة حول الهدف', exact: true });
              if (!(await buildAction.evaluate(el => el === document.activeElement))) {
                throw new Error(`HOME-A ${width}: build focus continuity failed`);
              }
              await shot(hero, width, 'hero-build-action-focus');

              for (const action of ['رتّب الرحلة حول الهدف', 'وحّد التجربة', 'جرّب المسار']) {
                await hero.getByRole('button', { name: action, exact: true }).press('Enter');
              }
              const brief = hero.getByLabel('طلبك المختصر', { exact: true });
              if ((await brief.inputValue()) !== '') throw new Error(`HOME-A ${width}: brief was pre-authored`);
              if (!(await brief.evaluate(el => el === document.activeElement))) {
                throw new Error(`HOME-A ${width}: brief focus continuity failed`);
              }
              await shot(hero, width, 'hero-brief-empty-focus');

              await brief.fill('أحتاج تبسيط رحلة التسجيل');
              await shot(hero, width, 'hero-brief-user-authored');
              await page.keyboard.press('Tab');
              await hero.getByRole('button', { name: 'جهّز الملخّص', exact: true }).press('Enter');
              const launch = hero.locator('.e2-launch-chamber');
              if (!(await launch.evaluate(el => el === document.activeElement))) {
                throw new Error(`HOME-A ${width}: launch focus continuity failed`);
              }
              await shot(hero, width, 'hero-launch-focus');

              await page.goto('http://127.0.0.1:4191/');
              await page.evaluate(() => document.fonts.ready);
              const s02 = page.locator('#solutions-universe');
              const commerce = s02.locator('.s02-station-2');
              await commerce.hover();
              if ((await s02.getAttribute('data-active')) !== 'business') {
                throw new Error(`HOME-A ${width}: hover mutated selection`);
              }
              if ((await s02.getAttribute('data-preview')) !== 'commerce') {
                throw new Error(`HOME-A ${width}: preview state missing`);
              }
              await shot(s02, width, 's02-preview-not-selected');

              await commerce.click();
              if ((await s02.getAttribute('data-active')) !== 'commerce') {
                throw new Error(`HOME-A ${width}: explicit activation failed`);
              }
              await shot(s02, width, 's02-explicit-selected');

              const dims = await page.evaluate(() => ({
                client: document.documentElement.clientWidth,
                scroll: document.documentElement.scrollWidth,
              }));
              if (dims.scroll > dims.client + 1) throw new Error(`HOME-A ${width}: horizontal overflow ${dims.scroll}/${dims.client}`);
              if (consoleErrors.length || pageErrors.length) {
                throw new Error(`HOME-A ${width}: runtime errors console=${JSON.stringify(consoleErrors)} page=${JSON.stringify(pageErrors)}`);
              }
              report.push({ width, consoleErrors, pageErrors, document: dims });
              await context.close();
            }

            fs.writeFileSync(path.join(out, 'capture-report.json'), JSON.stringify(report, null, 2));
            fs.writeFileSync(path.join(out, 'screenshots-inventory.txt'), inventory.join('\n') + '\n');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          node "$RUNNER_TEMP/capture-home-a.cjs" 2>&1 | tee "$EVIDENCE_DIR/logs/capture.log"

      - name: Summarize HOME-A evidence and test counts
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          node <<'NODE' | tee "$EVIDENCE_DIR/test-counts.txt"
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join(process.env.EVIDENCE_DIR, 'reports');
          if (!fs.existsSync(dir)) process.exit(0);
          for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()) {
            try {
              const report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const s = report.stats || {};
              console.log(`${file}: expected=${s.expected ?? 'n/a'} unexpected=${s.unexpected ?? 'n/a'} flaky=${s.flaky ?? 'n/a'} skipped=${s.skipped ?? 'n/a'} duration_ms=${s.duration ?? 'n/a'}`);
            } catch (error) {
              console.log(`${file}: report_parse_error=${error.message}`);
            }
          }
          NODE
          find "$EVIDENCE_DIR/screenshots" -maxdepth 1 -type f -name '*.png' -printf '%f\n' 2>/dev/null | sort | tee "$EVIDENCE_DIR/screenshots-inventory.txt" || true
          {
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "gate=${{ steps.gate.outcome }}"
            echo "node=${{ steps.node.outcome }}"
            echo "npm_ci=${{ steps.npm_ci.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "chromium=${{ steps.chromium.outcome }}"
            echo "targeted=${{ steps.targeted.outcome }}"
            echo "home_regression=${{ steps.home_regression.outcome }}"
            echo "public_regression=${{ steps.public_regression.outcome }}"
            echo "capture=${{ steps.capture.outcome }}"
          } | tee "$EVIDENCE_DIR/step-outcomes.txt"

      - name: Upload HOME-A SHA-bound evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-w12-home-a-055a908af7720373f086c889fc93d75c2b7c8568
          path: /tmp/gs-w12-home-a
          if-no-files-found: error
          retention-days: 14

      - name: Enforce truthful HOME-A result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          statuses=(
            "${{ steps.checkout.outcome }}"
            "${{ steps.gate.outcome }}"
            "${{ steps.node.outcome }}"
            "${{ steps.npm_ci.outcome }}"
            "${{ steps.lint.outcome }}"
            "${{ steps.typecheck.outcome }}"
            "${{ steps.build.outcome }}"
            "${{ steps.chromium.outcome }}"
            "${{ steps.targeted.outcome }}"
            "${{ steps.home_regression.outcome }}"
            "${{ steps.public_regression.outcome }}"
            "${{ steps.capture.outcome }}"
            "${{ steps.artifact.outcome }}"
          )
          printf '%s\n' "${statuses[@]}"
          for status in "${statuses[@]}"; do test "$status" = "success"; done

