name: GS Deep Rem Exact-Head Validation

on:
  push:
    branches:
      - governance/gs-deep-rem-exact-head-validation-r1
    paths:
      - .github/workflows/gs-deep-rem-exact-head-validation.yml
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches:
      - governance/gs-deep-review-w08-c-current-baseline
    paths:
      - .github/workflows/gs-deep-rem-exact-head-validation.yml

permissions:
  contents: read
  actions: read

jobs:
  observe_push:
    name: Observe matching push validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate SHA-matching push run
        shell: bash
        env:
          OBSERVED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${OBSERVED_HEAD}&event=push&per_page=50"
          for _ in $(seq 1 10); do
            json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$api")"
            match="$(printf '%s' "$json" | jq -r --arg sha "$OBSERVED_HEAD" \
              '.workflow_runs[] | select(.name == "GS Deep Rem Exact-Head Validation" and .head_sha == $sha and .event == "push") | [.id, .status, (.conclusion // "pending"), .head_sha, .html_url] | @tsv' \
              | head -n 1)"
            if [[ -n "$match" ]]; then
              echo "matching_push_run=$match"
              exit 0
            fi
            sleep 2
          done
          echo "Matching push validation run was not observed for ${OBSERVED_HEAD}" >&2
          exit 1

  home_a:
    name: HOME-A exact 055a908
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: 055a908af7720373f086c889fc93d75c2b7c8568
      PARENT_SHA: 5acba33a23c3424dbdfbfd5ef8bc94a6f7fe494a
      EVIDENCE_DIR: /tmp/gs-w12-home-a
    steps:
      - name: Check out exact HOME-A candidate
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: 055a908af7720373f086c889fc93d75c2b7c8568
          fetch-depth: 0
          persist-credentials: false

      - name: Verify HOME-A identity ancestry path boundary and diff
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/reports" "$EVIDENCE_DIR/screenshots"
          {
            echo "classification=REFERENCE_ONLY"
            echo "candidate=HOME-A"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
          } | tee "$EVIDENCE_DIR/identity.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$PARENT_SHA" "$CANDIDATE_SHA")" = "$PARENT_SHA"
          read -r behind ahead < <(git rev-list --left-right --count "$PARENT_SHA...$CANDIDATE_SHA")
          printf 'behind=%s\nahead=%s\n' "$behind" "$ahead" | tee "$EVIDENCE_DIR/ahead-behind.txt"
          test "$behind" -eq 0
          test "$ahead" -gt 0
          cat > "$EVIDENCE_DIR/expected-paths.txt" <<'EOF'
          src/components/hero/LivingSystemHero.tsx
          src/components/sections/SolutionsUniverse.tsx
          tests/visual/home-public-routing/home-deep-r1-a.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/expected-paths.txt"
          git diff --name-only "$PARENT_SHA...$CANDIDATE_SHA" | sort | tee "$EVIDENCE_DIR/actual-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-paths.txt" "$EVIDENCE_DIR/actual-paths.txt" | tee "$EVIDENCE_DIR/path-boundary.diff"
          git diff --stat "$PARENT_SHA...$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --check "$PARENT_SHA...$CANDIDATE_SHA" 2>&1 | tee "$EVIDENCE_DIR/logs/git-diff-check.log"

      - name: Set up Node 20 for HOME-A
        id: node
        if: steps.gate.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci HOME-A
        id: npm_ci
        if: steps.node.outcome == 'success'
        continue-on-error: true
        run: npm ci 2>&1 | tee "$EVIDENCE_DIR/logs/npm-ci.log"

      - name: Lint HOME-A
        id: lint
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run lint 2>&1 | tee "$EVIDENCE_DIR/logs/lint.log"

      - name: Typecheck HOME-A
        id: typecheck
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/typecheck.log"

      - name: Build HOME-A
        id: build
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build.log"

      - name: Install Chromium HOME-A
        id: chromium
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npx playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/logs/playwright-install.log"

      - name: Run HOME-A targeted and existing regressions
        id: tests
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          run_suite() {
            local label="$1"; shift
            npx playwright test "$@" --project=chromium --workers=1 --reporter=json \
              > "$EVIDENCE_DIR/reports/${label}.json" \
              2> "$EVIDENCE_DIR/logs/${label}.stderr.log"
            rc=$?
            echo "$rc" > "$EVIDENCE_DIR/reports/${label}.exit"
            if [[ "$rc" -ne 0 ]]; then failed=1; fi
          }
          run_suite home-a-targeted tests/visual/home-public-routing/home-deep-r1-a.spec.ts --config=playwright.config.ts
          run_suite home-routing tests/visual/home-public-routing/home-public-routing.spec.ts --config=playwright.config.ts
          run_suite public-site-integration tests/visual/public-site.integration.spec.ts --config=playwright.config.ts
          exit "$failed"

      - name: Capture HOME-A rendered evidence at exact widths
        id: capture
        if: steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4191 --strictPort > "$EVIDENCE_DIR/logs/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f "$GITHUB_WORKSPACE/.gs-w12-home-a-capture.cjs"' EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4191/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" -eq 1
          cat > "$GITHUB_WORKSPACE/.gs-w12-home-a-capture.cjs" <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const out = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const inventory = [];
            const issues = [];
            const report = [];
            const shot = async (locator, width, name) => {
              const file = path.join(out, 'screenshots', `home-a-${width}-${name}.png`);
              await locator.screenshot({ path: file, animations: 'disabled' });
              inventory.push(path.basename(file));
            };
            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 900;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(e.message));
              try {
                await page.goto('http://127.0.0.1:4191/');
                await page.evaluate(() => document.fonts.ready);
                if ((await page.locator('html').getAttribute('dir')) !== 'rtl') issues.push(`${width}: html dir is not rtl`);
                const hero = page.locator('#hero');
                await hero.getByRole('button', { name: 'إطلاق خدمة رقمية', exact: true }).click();
                const direction = hero.getByRole('button', { name: 'خطوة رئيسية واحدة' });
                if (!(await direction.evaluate(el => el === document.activeElement))) issues.push(`${width}: direction did not receive focus`);
                await shot(hero, width, 'hero-direction-focus');
                await direction.press('Enter');
                const arrange = hero.getByRole('button', { name: 'رتّب الرحلة حول الهدف', exact: true });
                if (!(await arrange.evaluate(el => el === document.activeElement))) issues.push(`${width}: build action did not receive focus`);
                await shot(hero, width, 'hero-build-action-focus');
                for (const action of ['رتّب الرحلة حول الهدف', 'وحّد التجربة', 'جرّب المسار']) {
                  await hero.getByRole('button', { name: action, exact: true }).press('Enter');
                }
                const brief = hero.getByLabel('طلبك المختصر', { exact: true });
                if ((await brief.inputValue()) !== '') issues.push(`${width}: brief was pre-authored`);
                await shot(hero, width, 'hero-brief-empty-focus');
                await brief.fill('أحتاج تبسيط رحلة التسجيل');
                await shot(hero, width, 'hero-brief-user-authored');
                await page.keyboard.press('Tab');
                await hero.getByRole('button', { name: 'جهّز الملخّص', exact: true }).press('Enter');
                const launch = hero.locator('.e2-launch-chamber');
                if (!(await launch.evaluate(el => el === document.activeElement))) issues.push(`${width}: launch did not receive focus`);
                await shot(hero, width, 'hero-launch-focus');

                await page.goto('http://127.0.0.1:4191/');
                await page.evaluate(() => document.fonts.ready);
                const s02 = page.locator('#solutions-universe');
                const commerce = s02.locator('.s02-station-2');
                await commerce.hover();
                if ((await s02.getAttribute('data-active')) !== 'business') issues.push(`${width}: hover mutated S02 selection`);
                if ((await s02.getAttribute('data-preview')) !== 'commerce') issues.push(`${width}: S02 preview missing`);
                await shot(s02, width, 's02-preview-not-selected');
                await commerce.focus();
                await shot(s02, width, 's02-edge-focus');
                await commerce.click();
                if ((await s02.getAttribute('data-active')) !== 'commerce') issues.push(`${width}: explicit S02 selection failed`);
                await shot(s02, width, 's02-explicit-selected');
                const dims = await page.evaluate(() => ({ client: document.documentElement.clientWidth, scroll: document.documentElement.scrollWidth }));
                if (dims.scroll > dims.client + 1) issues.push(`${width}: horizontal overflow ${dims.scroll}/${dims.client}`);
                if (consoleErrors.length) issues.push(`${width}: console errors ${JSON.stringify(consoleErrors)}`);
                if (pageErrors.length) issues.push(`${width}: page errors ${JSON.stringify(pageErrors)}`);
                report.push({ width, consoleErrors, pageErrors, document: dims });
              } catch (error) {
                issues.push(`${width}: capture exception ${error.message}`);
              } finally {
                await context.close();
              }
            }
            fs.writeFileSync(path.join(out, 'capture-report.json'), JSON.stringify({ report, issues }, null, 2));
            fs.writeFileSync(path.join(out, 'screenshots-inventory.txt'), inventory.join('\n') + '\n');
            await browser.close();
            if (issues.length) { console.error(issues.join('\n')); process.exit(1); }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node "$GITHUB_WORKSPACE/.gs-w12-home-a-capture.cjs" 2>&1 | tee "$EVIDENCE_DIR/logs/capture.log"

      - name: Summarize HOME-A evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          node <<'NODE' | tee "$EVIDENCE_DIR/test-counts.txt"
          const fs = require('node:fs'); const path = require('node:path');
          const dir = path.join(process.env.EVIDENCE_DIR, 'reports');
          if (fs.existsSync(dir)) for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()) {
            try { const s = JSON.parse(fs.readFileSync(path.join(dir,file),'utf8')).stats || {}; console.log(`${file}: expected=${s.expected ?? 'n/a'} unexpected=${s.unexpected ?? 'n/a'} flaky=${s.flaky ?? 'n/a'} skipped=${s.skipped ?? 'n/a'} duration_ms=${s.duration ?? 'n/a'}`); }
            catch (e) { console.log(`${file}: report_parse_error=${e.message}`); }
          }
          NODE
          find "$EVIDENCE_DIR/screenshots" -maxdepth 1 -type f -name '*.png' -printf '%f\n' 2>/dev/null | sort | tee "$EVIDENCE_DIR/screenshots-inventory.txt" || true
          printf 'gate=%s\nnpm_ci=%s\nlint=%s\ntypecheck=%s\nbuild=%s\nchromium=%s\ntests=%s\ncapture=%s\n' \
            '${{ steps.gate.outcome }}' '${{ steps.npm_ci.outcome }}' '${{ steps.lint.outcome }}' '${{ steps.typecheck.outcome }}' '${{ steps.build.outcome }}' '${{ steps.chromium.outcome }}' '${{ steps.tests.outcome }}' '${{ steps.capture.outcome }}' \
            | tee "$EVIDENCE_DIR/step-outcomes.txt"

      - name: Upload HOME-A SHA-bound evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-w12-home-a-055a908af7720373f086c889fc93d75c2b7c8568
          path: /tmp/gs-w12-home-a
          if-no-files-found: error
          retention-days: 14

      - name: Enforce truthful HOME-A result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for status in '${{ steps.checkout.outcome }}' '${{ steps.gate.outcome }}' '${{ steps.node.outcome }}' '${{ steps.npm_ci.outcome }}' '${{ steps.lint.outcome }}' '${{ steps.typecheck.outcome }}' '${{ steps.build.outcome }}' '${{ steps.chromium.outcome }}' '${{ steps.tests.outcome }}' '${{ steps.capture.outcome }}' '${{ steps.artifact.outcome }}'; do
            test "$status" = success
          done

  home_b:
    name: HOME-B exact 014422a
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
