name: Controller W05 Integrated Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - controller/gs-home-w05-v2-visual-authority
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  W05_APPLICATION_SHA: b1728cef8af0b31a89e16ea945b178edae49fd53

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact W05 application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.W05_APPLICATION_SHA }}

      - name: Verify exact application commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$W05_APPLICATION_SHA"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete committed Playwright suite and capture W05 evidence
        env:
          W05_EVIDENCE_DIR: controller-w05-evidence
        run: npx playwright test --project=chromium --workers=1

      - name: Verify integrated evidence matrix
        shell: bash
        run: |
          test -d controller-w05-evidence
          count="$(find controller-w05-evidence -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = "40"
          for width in 1440 1024 768 430 390; do
            for slug in home solutions-entry reference-projects how-we-work start-direct 404; do
              test -s "controller-w05-evidence/w05-${width}-${slug}.png"
            done
          done
          for width in 1440 390; do
            test -s "controller-w05-evidence/w05-${width}-solutions-recommendation.png"
            test -s "controller-w05-evidence/w05-${width}-solutions-configuration.png"
            test -s "controller-w05-evidence/w05-${width}-solutions-decision-summary.png"
            test -s "controller-w05-evidence/w05-${width}-start-solutions-prefill.png"
          done
          test -s "controller-w05-evidence/w05-390-mobile-navigation.png"
          test -s "controller-w05-evidence/w05-390-reference-projects-rp04-boundary.png"

      - name: Upload W05 integrated evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-pages-w05-controller-reference-only-${{ env.W05_APPLICATION_SHA }}
          path: controller-w05-evidence
          if-no-files-found: error
          retention-days: 7
