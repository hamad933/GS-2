name: Visual Evidence

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - '.github/workflows/visual-evidence.yml'
      - 'docs/visual/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: visual-evidence/public-site
      W05_EVIDENCE_DIR: visual-evidence/public-site
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify pull request diff integrity
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Classify W08-B product scope from pull request diff
        id: w08b-scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          w08b_product_paths=(
            'src/components/footer/Footer.remediation.css'
            'src/components/footer/Footer.tsx'
            'src/components/project/ProjectMedia.tsx'
            'src/components/sections/ReferenceProof.remediation.css'
            'src/components/sections/ReferenceProof.tsx'
            'src/data/homeShowcase.ts'
          )

          in_scope=false
          for owned_path in "${w08b_product_paths[@]}"; do
            if printf '%s\n' "${changed_paths[@]}" | grep -Fxq "$owned_path"; then
              echo "W08-B product scope changed: $owned_path"
              in_scope=true
            fi
          done

          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"
          if [[ "$in_scope" == 'false' ]]; then
            echo '::notice::No W08-B-owned product path changed in the pull request base-to-head diff.'
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Solutions canonical harness
        run: npx playwright test --config=tests/visual/solutions/playwright.config.ts

      - name: Run Start and Discovery canonical harness
        run: npx playwright test --config=tests/visual/start-discovery/playwright.config.ts

      - name: Run Public Semantics canonical harness
        run: npx playwright test --config=tests/visual/public-semantics/playwright.config.ts

      - name: Run Reference Projects canonical harness
        run: npx playwright test --config=tests/visual/reference-projects/playwright.config.ts

      - name: Run root route-performance suite
        run: npx playwright test tests/visual/route-performance/route-performance.spec.ts --project=chromium --workers=1

      - name: Run root How We Work suite
        run: npx playwright test tests/visual/how-we-work/how-we-work.visual.spec.ts --project=chromium --workers=1

      - name: Run root shell-routing suite
        run: npx playwright test tests/visual/shell.routing.spec.ts --project=chromium --workers=1

      - name: Run root Home public-routing suite
        run: npx playwright test tests/visual/home-public-routing/home-public-routing.spec.ts --project=chromium --workers=1

      - name: Enforce and run W08-B specialized regression
        shell: bash
        env:
          W08_B_IN_SCOPE: ${{ steps.w08b-scope.outputs.in_scope || 'false' }}
        run: |
          set -euo pipefail

          test_path='tests/visual/home-public-routing/gs-pages-w08-b-home-truth.spec.ts'
          if [[ -f "$test_path" ]]; then
            echo "W08-B specialized regression present; executing: $test_path"
            npx playwright test "$test_path" --project=chromium --workers=1
          elif [[ "$W08_B_IN_SCOPE" == 'true' ]]; then
            echo "::error::W08-B-owned product scope changed, but required specialized regression is missing: $test_path"
            exit 1
          else
            echo "::notice::W08-B product scope is out of scope for this exact candidate and the specialized regression is absent; informational skip: $test_path"
          fi

      - name: Validate whole public site
        run: npx playwright test tests/visual/public-site.integration.spec.ts --project=chromium --workers=1

      - name: Capture whole public site evidence
        run: npx playwright test tests/visual/public-site.evidence.spec.ts --project=chromium --workers=1

      - name: Verify captured evidence
        shell: bash
        run: |
          test -d "$EVIDENCE_DIR"
          mapfile -t files < <(find "$EVIDENCE_DIR" -type f -name '*.png' -print | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -s "$file"
          done

          for required in \
            'w08-r5-1440-solutions-compare-at-limit.png' \
            'w08-r5-390-solutions-compare-at-limit.png'; do
            test -s "$EVIDENCE_DIR/$required"
          done

      - name: Upload reference-only visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-public-site-reference-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/public-site
          if-no-files-found: error
          retention-days: 7
