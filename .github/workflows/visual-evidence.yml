name: Visual Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/implement-living-system-hero-s01
      - codex/implement-visual-reconstruction-for-homepage
      - controller/gs-home-w05-v2-visual-authority
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - '.github/workflows/visual-evidence.yml'

permissions:
  contents: read

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture visual evidence
        shell: bash
        run: |
          npx playwright test tests/visual/hero.visual.spec.ts --project=chromium --workers=1

          cat > tests/visual/__controller_1024_evidence.spec.ts <<'EOF'
          import { mkdir } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { expect, test } from '@playwright/test';

          const OUT = resolve('visual-evidence');

          test.beforeAll(async () => {
            await mkdir(OUT, { recursive: true });
          });

          test('controller captures responsive 1024 visual evidence', async ({ page }) => {
            await page.setViewportSize({ width: 1024, height: 900 });
            await page.goto('/');
            await page.evaluate(() => document.fonts.ready);
            await expect(page.locator('#hero')).toHaveAttribute('data-stage', 'need');

            await page.locator('#hero').screenshot({
              path: resolve(OUT, 'controller-1024-hero-k01.png'),
              animations: 'disabled',
            });

            const s02 = page.locator('#solutions-universe');
            await s02.scrollIntoViewIfNeeded();
            await s02.getByRole('button', { name: /الأنظمة التشغيلية والبوابات/ }).click();
            await expect(s02).toHaveAttribute('data-active', 'portals');
            await page.waitForTimeout(400);
            await s02.screenshot({
              path: resolve(OUT, 'controller-1024-s02-active.png'),
              animations: 'disabled',
            });

            const s03 = page.locator('#reference-proof');
            await s03.scrollIntoViewIfNeeded();
            await s03.getByRole('button', { name: /Enterprise Operations/ }).click();
            await expect(s03).toHaveAttribute('data-project', 'rp02');
            await expect(s03.locator('.project-index button')).toHaveCount(3);
            await page.waitForTimeout(400);
            await s03.screenshot({
              path: resolve(OUT, 'controller-1024-s03-rp02.png'),
              animations: 'disabled',
            });

            for (const selector of ['#system-anatomy', '#project-gateway', 'footer']) {
              await page.locator(selector).scrollIntoViewIfNeeded();
              await page.waitForTimeout(250);
            }
            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'auto' }));
            await page.waitForTimeout(400);

            const dimensions = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.clientWidth + 1);

            await page.screenshot({
              path: resolve(OUT, 'controller-1024-home-full.png'),
              fullPage: true,
              animations: 'disabled',
            });
          });
          EOF

          npx playwright test tests/visual/__controller_1024_evidence.spec.ts --project=chromium --workers=1
          rm tests/visual/__controller_1024_evidence.spec.ts

          for file in \
            controller-1024-hero-k01.png \
            controller-1024-s02-active.png \
            controller-1024-s03-rp02.png \
            controller-1024-home-full.png; do
            test -s "visual-evidence/$file"
          done

      - name: Verify screenshot files
        shell: bash
        run: |
          for file in \
            desktop-w05-v2-a-hero-k01.png \
            desktop-w05-v2-a-hero-k02.png \
            desktop-w05-v2-a-hero-k03.png \
            desktop-w05-v2-a-hero-k04.png \
            desktop-w05-r3-home-full.png \
            desktop-w05-r3-hero-need.png \
            desktop-w05-r3-hero-direction.png \
            desktop-w05-r3-hero-build.png \
            desktop-w05-r3-hero-launch.png \
            desktop-w05-r3-solutions-default.png \
            desktop-w05-r3-solutions-active.png \
            desktop-w05-r3-project-rp01.png \
            desktop-w05-r3-project-rp02.png \
            desktop-w05-r3-anatomy-active.png \
            desktop-w05-r3-gateway.png \
            tablet-w05-r3-home-full.png \
            mobile-w05-r3-home-full.png \
            mobile-w05-r3-hero-build.png \
            mobile-w05-r3-solutions-active.png \
            mobile-w05-r3-project.png \
            mobile-w05-r3-anatomy.png \
            mobile-w05-r3-gateway.png; do
            test -s "visual-evidence/$file"
          done

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-home-w05-v2-a-reference-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7
