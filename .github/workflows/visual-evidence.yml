name: Visual Evidence

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - '.github/workflows/visual-evidence.yml'
      - 'docs/visual/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: visual-evidence/public-site
      W05_EVIDENCE_DIR: visual-evidence/public-site
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify pull request diff integrity
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dedicated public-site regression matrix
        run: >-
          npx playwright test
          tests/visual/solutions/solutions-workspace.visual.spec.ts
          tests/visual/start-discovery/start-discovery.spec.ts
          tests/visual/route-performance/route-performance.spec.ts
          tests/visual/public-semantics/public-semantics.spec.ts
          --project=chromium
          --workers=1

      - name: Run W08-B home truth regression when present
        shell: bash
        run: |
          test_path='tests/visual/home-public-routing/gs-pages-w08-b-home-truth.spec.ts'
          if [[ -f "$test_path" ]]; then
            echo "W08-B specialized regression present; executing: $test_path"
            npx playwright test "$test_path" --project=chromium --workers=1
          else
            echo "::notice::W08-B specialized regression is absent on this exact head; informational skip: $test_path"
          fi

      - name: Validate whole public site
        run: npx playwright test tests/visual/public-site.integration.spec.ts --project=chromium --workers=1

      - name: Capture whole public site evidence
        run: npx playwright test tests/visual/public-site.evidence.spec.ts --project=chromium --workers=1

      - name: Verify captured evidence
        shell: bash
        run: |
          test -d "$EVIDENCE_DIR"
          mapfile -t files < <(find "$EVIDENCE_DIR" -type f -name '*.png' -print | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -s "$file"
          done

          for required in \
            'w08-r5-1440-solutions-compare-at-limit.png' \
            'w08-r5-390-solutions-compare-at-limit.png'; do
            test -s "$EVIDENCE_DIR/$required"
          done

      - name: Upload reference-only visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-public-site-reference-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/public-site
          if-no-files-found: error
          retention-days: 7
