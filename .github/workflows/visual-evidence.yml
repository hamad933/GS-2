name: Visual Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/implement-living-system-hero-s01
      - codex/implement-visual-reconstruction-for-homepage
      - controller/gs-home-w05-v2-visual-authority
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - '.github/workflows/visual-evidence.yml'

permissions:
  contents: read

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture visual evidence
        run: npx playwright test tests/visual/hero.visual.spec.ts --project=chromium --workers=1

      - name: Verify screenshot files
        shell: bash
        run: |
          for file in \
            desktop-w05-v2-a-hero-k01.png \
            desktop-w05-v2-a-hero-k02.png \
            desktop-w05-v2-a-hero-k03.png \
            desktop-w05-v2-a-hero-k04.png \
            desktop-w05-r3-home-full.png \
            desktop-w05-r3-hero-need.png \
            desktop-w05-r3-hero-direction.png \
            desktop-w05-r3-hero-build.png \
            desktop-w05-r3-hero-launch.png \
            desktop-w05-r3-solutions-default.png \
            desktop-w05-r3-solutions-active.png \
            desktop-w05-r3-project-rp01.png \
            desktop-w05-r3-project-rp02.png \
            desktop-w05-r3-anatomy-active.png \
            desktop-w05-r3-gateway.png \
            tablet-w05-r3-home-full.png \
            mobile-w05-r3-home-full.png \
            mobile-w05-r3-hero-build.png \
            mobile-w05-r3-solutions-active.png \
            mobile-w05-r3-project.png \
            mobile-w05-r3-anatomy.png \
            mobile-w05-r3-gateway.png; do
            test -s "visual-evidence/$file"
          done

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-home-w05-v2-a-reference-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7
