name: Controller W01 Evidence

on:
  pull_request:
    branches:
      - controller/gs-home-w05-v2-visual-authority
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - '.github/workflows/visual-evidence.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homepage regression and W01 shell suite
        run: npx playwright test tests/visual/hero.visual.spec.ts tests/visual/shell.routing.spec.ts --project=chromium --workers=1

      - name: Verify W01 shell evidence
        shell: bash
        run: |
          test -s visual-evidence/w01-shell-solutions-1440.png
          test -s visual-evidence/w01-shell-mobile-menu-390.png

      - name: Upload controller evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-pages-w01-reference-only-${{ github.event.pull_request.head.sha }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7
