name: Controller W04 Evidence

on:
  pull_request:
    branches:
      - controller/gs-home-w05-v2-visual-authority
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - '.github/workflows/visual-evidence.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homepage regression
        run: npx playwright test tests/visual/hero.visual.spec.ts --project=chromium --workers=1

      - name: Run W04 Start Discovery suite
        run: START_DISCOVERY_EVIDENCE_DIR=visual-evidence/start-discovery npx playwright test -c tests/visual/start-discovery/playwright.config.ts

      - name: Verify W04 evidence
        shell: bash
        run: |
          test -s visual-evidence/start-discovery/start-discovery-1440-foundation.png
          test -s visual-evidence/start-discovery/start-discovery-1024-foundation.png
          test -s visual-evidence/start-discovery/start-discovery-768-foundation.png
          test -s visual-evidence/start-discovery/start-discovery-430-foundation.png
          test -s visual-evidence/start-discovery/start-discovery-390-foundation.png
          test -s visual-evidence/start-discovery/start-discovery-1440-prefilled-summary.png
          test -s visual-evidence/start-discovery/start-discovery-390-prefilled-summary.png

      - name: Upload controller evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-pages-w04-reference-only-${{ github.event.pull_request.head.sha }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7
