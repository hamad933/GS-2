name: GS HOME + W02 Exact-Head Validation

on:
  push:
    branches:
      - governance/gs-home-w02-exact-head-validation-r1
  # Metadata-only observer. HOME/W02 validation remains push-only.
  pull_request:
    types: [synchronize]
    branches:
      - governance/gs-deep-review-w08-c-current-baseline
    paths:
      - .github/workflows/gs-home-w02-exact-head-validation.yml

permissions:
  contents: read

jobs:
  home:
    name: HOME exact candidate R3
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HOME_SHA: 5acba33a23c3424dbdfbfd5ef8bc94a6f7fe494a
      HOME_R3_PARENT: 2c79c03a0f8a855d18a84eca1d2aae64e673393b
      HOME_BASE: bef381bcebde8199f263e1be465c5b0010058f5d
      EVIDENCE_DIR: /tmp/gs-home-evidence
      VISUAL_EVIDENCE_DIR: /tmp/gs-home-evidence/repo-native
    steps:
      - name: Observe corresponding push validation run
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          OBSERVED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${OBSERVED_HEAD}&event=push&per_page=20"
          for _ in $(seq 1 45); do
            json="$(curl -fsSL -H 'Accept: application/vnd.github+json' "$api")"
            match="$(printf '%s' "$json" | jq -r --arg sha "$OBSERVED_HEAD" '.workflow_runs[] | select(.name == "GS HOME + W02 Exact-Head Validation" and .event == "push" and .head_sha == $sha) | [.id, .status, (.conclusion // "pending"), .head_sha, .event, .html_url] | @tsv' | head -n 1)"
            if [[ -n "$match" ]]; then
              echo "push_run=${match}"
              exit 0
            fi
            sleep 2
          done
          echo 'Matching push validation run was not observed.' >&2
          exit 1

      - name: Initialize HOME evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/repo-native"
          cat > "$EVIDENCE_DIR/manifest.txt" <<'EOF'
          classification=REFERENCE_ONLY
          workstream=GS-GOV-W11-HOME-W02-EXACT-HEAD-VALIDATION-R1
          revision=R3
          target=HOME
          required_widths=1440,768,430,390
          EOF

      - name: Check out exact HOME R3 candidate
        if: github.event_name == 'push'
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: 5acba33a23c3424dbdfbfd5ef8bc94a6f7fe494a
          fetch-depth: 0
          persist-credentials: false

      - name: Verify HOME identity ancestry R3 delta and cumulative boundary
        id: home_gate
        if: github.event_name == 'push' && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_head=$HOME_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
            echo "expected_r3_parent=$HOME_R3_PARENT"
            echo "actual_parent=$(git rev-parse HEAD^)"
            echo "frozen_base=$HOME_BASE"
            echo "merge_base=$(git merge-base "$HOME_BASE" "$HOME_SHA")"
          } | tee "$EVIDENCE_DIR/exact-checkout-identity.txt"

          test "$(git rev-parse HEAD)" = "$HOME_SHA"
          test "$(git rev-parse HEAD^)" = "$HOME_R3_PARENT"
          test "$(git merge-base "$HOME_BASE" "$HOME_SHA")" = "$HOME_BASE"
          test "$(git rev-list --count "$HOME_R3_PARENT..$HOME_SHA")" -eq 1

          cat > "$EVIDENCE_DIR/expected-r3-paths.txt" <<'EOF'
          src/components/sections/ReferenceProof.remediation.css
          EOF
          git diff --name-only "$HOME_R3_PARENT...$HOME_SHA" | sort | tee "$EVIDENCE_DIR/actual-r3-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-r3-paths.txt" "$EVIDENCE_DIR/actual-r3-paths.txt" | tee "$EVIDENCE_DIR/r3-path-verification.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-r3-paths.txt")" -eq 1
          git diff --stat "$HOME_R3_PARENT...$HOME_SHA" | tee "$EVIDENCE_DIR/r3-stat.txt"
          git diff --numstat "$HOME_R3_PARENT...$HOME_SHA" | tee "$EVIDENCE_DIR/r3-numstat.txt"
          awk 'NF == 3 { if ($1 != 6 || $2 != 0 || $3 != "src/components/sections/ReferenceProof.remediation.css") exit 1; seen=1 } END { exit !seen }' "$EVIDENCE_DIR/r3-numstat.txt"

          cat > "$EVIDENCE_DIR/expected-cumulative-paths.txt" <<'EOF'
          src/components/footer/Footer.remediation.css
          src/components/hero/LivingSystemHero.tsx
          src/components/sections/ReferenceProof.remediation.css
          src/components/sections/SolutionsUniverse.tsx
          src/components/sections/SystemAnatomy.remediation.css
          src/components/sections/SystemAnatomy.tsx
          tests/visual/home-public-routing/home-public-routing.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-cumulative-paths.txt" "$EVIDENCE_DIR/expected-cumulative-paths.txt"
          git diff --name-only "$HOME_BASE...$HOME_SHA" | sort | tee "$EVIDENCE_DIR/actual-cumulative-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-cumulative-paths.txt" "$EVIDENCE_DIR/actual-cumulative-paths.txt" | tee "$EVIDENCE_DIR/cumulative-path-verification.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-cumulative-paths.txt")" -eq 7
          git diff --stat "$HOME_BASE...$HOME_SHA" | tee "$EVIDENCE_DIR/cumulative-stat.txt"
          git diff --numstat "$HOME_BASE...$HOME_SHA" | tee "$EVIDENCE_DIR/cumulative-numstat.txt"

          : > "$EVIDENCE_DIR/w08b-product-identity.txt"
          for path in src/components/footer/Footer.tsx src/routes/publicRoutes.ts; do
            base_blob="$(git rev-parse "$HOME_BASE:$path")"
            head_blob="$(git rev-parse "$HOME_SHA:$path")"
            {
              echo "path=$path"
              echo "base_blob=$base_blob"
              echo "head_blob=$head_blob"
              if [[ "$base_blob" = "$head_blob" ]]; then echo "equal=true"; else echo "equal=false"; fi
            } >> "$EVIDENCE_DIR/w08b-product-identity.txt"
            test "$base_blob" = "$head_blob"
          done

      - name: Set up Node 20 for HOME
        id: home_node
        if: github.event_name == 'push' && steps.home_gate.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute HOME R3 validation contract
        id: home_validation
        if: github.event_name == 'push' && steps.home_gate.outcome == 'success' && steps.home_node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/command-status.txt"

          run_logged() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE_DIR/logs/${label}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}=${rc}" >> "$EVIDENCE_DIR/command-status.txt"
            LAST_RC=$rc
          }

          run_logged git-diff-check git diff --check "$HOME_BASE...$HOME_SHA"
          run_logged npm-ci npm ci
          run_logged lint npm run lint
          run_logged typecheck npm run typecheck
          run_logged build npm run build
          run_logged playwright-install npx playwright install chromium

          run_logged home-public-routing npx playwright test \
            tests/visual/home-public-routing/home-public-routing.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1
          HOME_TEST_RC=$LAST_RC
          if [[ "$HOME_TEST_RC" -ne 0 ]]; then
            run_logged home-public-routing-trace-rerun npx playwright test \
              tests/visual/home-public-routing/home-public-routing.spec.ts \
              --config=playwright.config.ts \
              --project=chromium \
              --workers=1 \
              --trace=retain-on-failure
          fi

          run_logged public-site-integration npx playwright test \
            tests/visual/public-site.integration.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1
          PUBLIC_TEST_RC=$LAST_RC
          if [[ "$PUBLIC_TEST_RC" -ne 0 ]]; then
            run_logged public-site-integration-trace-rerun npx playwright test \
              tests/visual/public-site.integration.spec.ts \
              --config=playwright.config.ts \
              --project=chromium \
              --workers=1 \
              --trace=retain-on-failure
          fi

          set +e
          npx playwright test \
            tests/visual/home-public-routing/gs-pages-w08-b-home-truth.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1 \
            --reporter=json \
            > "$EVIDENCE_DIR/logs/w08b-home-truth.json" \
            2> "$EVIDENCE_DIR/logs/w08b-home-truth.stderr.log"
          W08B_RC=$?
          set -e
          echo "raw_exit_code=$W08B_RC" > "$EVIDENCE_DIR/w08b-reference-only-status.txt"

          if [[ "$W08B_RC" -eq 0 ]]; then
            echo "classification=REFERENCE_ONLY_PASS" >> "$EVIDENCE_DIR/w08b-reference-only-status.txt"
            echo "w08b-classification=0" >> "$EVIDENCE_DIR/command-status.txt"
          else
            set +e
            W08B_JSON="$EVIDENCE_DIR/logs/w08b-home-truth.json" node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.W08B_JSON;
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failures = [];
          function walkSuite(suite) {
            for (const spec of suite.specs || []) {
              const bad = (spec.tests || []).flatMap((test) =>
                (test.results || []).filter((result) => result.status !== 'passed' && result.status !== 'skipped')
              );
              if (bad.length) {
                failures.push({
                  title: spec.title,
                  errors: bad.flatMap((r) => (r.errors || []).map((e) => `${e.message || ''}\n${e.stack || ''}`)).join('\n'),
                });
              }
            }
            for (const child of suite.suites || []) walkSuite(child);
          }
          for (const suite of report.suites || []) walkSuite(suite);
          const expectedTitle = 'Footer exposes no unverified mailto and routes its public action to Start with destination focus';
          const cleanErrors = failures.length === 1
            ? failures[0].errors.replace(/\u001b\[[0-9;]*m/g, '')
            : '';
          const known = failures.length === 1
            && failures[0].title === expectedTitle
            && cleanErrors.includes('ابدأ اختيارك')
            && cleanErrors.includes('Expected: 1')
            && cleanErrors.includes('Received: 2');
          fs.writeFileSync(
            process.env.EVIDENCE_DIR + '/w08b-classification.json',
            JSON.stringify({ failures, cleanErrors, knownPreexistingDuplicateOnly: known }, null, 2),
          );
          process.exit(known ? 0 : 1);
          NODE
            W08B_CLASS_RC=$?
            set -e
            if [[ "$W08B_CLASS_RC" -eq 0 ]] && ! grep -q 'equal=false' "$EVIDENCE_DIR/w08b-product-identity.txt"; then
              echo "classification=W08B_KNOWN_PREEXISTING_REFERENCE_ONLY" >> "$EVIDENCE_DIR/w08b-reference-only-status.txt"
              echo "w08b-classification=0" >> "$EVIDENCE_DIR/command-status.txt"
            else
              echo "classification=UNEXPECTED_DIFFERENTIAL_FAILURE" >> "$EVIDENCE_DIR/w08b-reference-only-status.txt"
              echo "w08b-classification=1" >> "$EVIDENCE_DIR/command-status.txt"
            fi
          fi

          capture_home() {
            npx vite preview \
              --host 127.0.0.1 \
              --port 4183 \
              --strictPort \
              > "$EVIDENCE_DIR/logs/home-preview.log" 2>&1 &
            local pid=$!
            local ready=0
            trap 'kill "$pid" 2>/dev/null || true' RETURN
            for _ in $(seq 1 45); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo 'HOME preview process exited before health became ready.' >&2
                cat "$EVIDENCE_DIR/logs/home-preview.log" >&2 || true
                return 1
              fi
              if curl -fsS http://127.0.0.1:4183/ >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              echo 'HOME preview health check did not succeed.' >&2
              cat "$EVIDENCE_DIR/logs/home-preview.log" >&2 || true
              return 1
            fi

            cat > "$RUNNER_TEMP/home-r3-capture.cjs" <<'NODE'
          const { chromium } = require('@playwright/test');
          const { writeFile } = require('node:fs/promises');
          const path = require('node:path');

          (async () => {
            const out = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failed = false;

            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 1000;
              const context = await browser.newContext({
                viewport: { width, height },
                reducedMotion: 'reduce',
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto('http://127.0.0.1:4183/', { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);

              const state = await page.evaluate(() => ({
                htmlDir: document.documentElement.getAttribute('dir'),
                computedDir: getComputedStyle(document.documentElement).direction,
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
              }));

              const hero = page.locator('#hero');
              const wall = hero.locator('.e2-operating-wall');
              const heroStages = [{
                stage: await hero.getAttribute('data-stage'),
                label: await wall.getAttribute('aria-label'),
              }];

              await page.screenshot({
                path: path.join(out, 'screenshots', `home-${width}-full.png`),
                fullPage: true,
                animations: 'disabled',
              });

              for (const [name, selector] of Object.entries({
                hero: '#hero',
                s02: '#solutions-universe',
                referenceProof: '#reference-proof',
                systemAnatomy: '#system-anatomy',
                footer: '.gs-footer',
              })) {
                const region = page.locator(selector);
                await region.scrollIntoViewIfNeeded();
                await region.screenshot({
                  path: path.join(out, 'screenshots', `home-${width}-${name}.png`),
                  animations: 'disabled',
                });
              }

              await hero.getByRole('button', { name: 'إطلاق خدمة رقمية', exact: true }).click();
              heroStages.push({
                stage: await hero.getAttribute('data-stage'),
                label: await wall.getAttribute('aria-label'),
              });
              const firstDirection = hero.getByRole('button', { name: 'خطوة رئيسية واحدة' });
              const directionClass = await firstDirection.getAttribute('class');
              await hero.screenshot({
                path: path.join(out, 'screenshots', `home-${width}-hero-direction.png`),
                animations: 'disabled',
              });

              await firstDirection.click();
              heroStages.push({
                stage: await hero.getAttribute('data-stage'),
                label: await wall.getAttribute('aria-label'),
              });
              for (const action of ['رتّب الرحلة حول الهدف', 'وحّد التجربة', 'جرّب المسار']) {
                await hero.getByRole('button', { name: action, exact: true }).click();
              }
              await hero.getByLabel('طلبك المختصر', { exact: true }).fill('Exact-head HOME R3 evidence capture');
              const prepare = hero.getByRole('button', { name: 'جهّز الملخّص', exact: true });
              const legacyPrepareCount = await hero.getByRole('button', { name: 'إرسال الطلب إلى الملخّص', exact: true }).count();
              await prepare.click();
              heroStages.push({
                stage: await hero.getAttribute('data-stage'),
                label: await wall.getAttribute('aria-label'),
              });
              const launchText = await hero.innerText();
              await hero.screenshot({
                path: path.join(out, 'screenshots', `home-${width}-hero-launch.png`),
                animations: 'disabled',
              });

              await page.reload({ waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const solutions = page.locator('#solutions-universe');
              await solutions.getByRole('button', { name: 'المجال التالي', exact: true }).click();
              const beforeFocus = await solutions.getAttribute('data-active');
              const portalStation = solutions.locator('.s02-station-5');
              await portalStation.focus();
              const afterFocus = await solutions.getAttribute('data-active');
              const pressedAfterFocus = await portalStation.getAttribute('aria-pressed');
              await portalStation.press('Enter');
              const afterActivation = await solutions.getAttribute('data-active');
              const pressedAfterActivation = await portalStation.getAttribute('aria-pressed');
              await solutions.screenshot({
                path: path.join(out, 'screenshots', `home-${width}-s02-activated.png`),
                animations: 'disabled',
              });

              const entry = {
                width,
                height,
                ...state,
                heroStages,
                directionClass: directionClass || '',
                legacyPrepareCount,
                launchNoSendTruth:
                  launchText.includes('لم يُرسل شيء بعد') &&
                  launchText.includes('لن يُرسل شيء تلقائيًا'),
                s02: {
                  beforeFocus,
                  afterFocus,
                  pressedAfterFocus,
                  afterActivation,
                  pressedAfterActivation,
                },
                consoleErrors,
                pageErrors,
              };
              report.push(entry);

              const expectedLabels = [
                'اختيار احتياج المشروع',
                'اختيار اتجاه الحل',
                'إعداد ملخّص المشروع',
                'مراجعة ملخّص الإطلاق',
              ];
              const labels = heroStages.map((item) => item.label);
              if (
                state.htmlDir !== 'rtl' ||
                state.computedDir !== 'rtl' ||
                state.scrollWidth > state.clientWidth + 1 ||
                !state.reducedMotion ||
                consoleErrors.length ||
                pageErrors.length ||
                labels.some((label, index) => label !== expectedLabels[index]) ||
                (directionClass || '').split(/\s+/).includes('preview') ||
                legacyPrepareCount !== 0 ||
                !entry.launchNoSendTruth ||
                beforeFocus !== 'commerce' ||
                afterFocus !== 'commerce' ||
                pressedAfterFocus !== 'false' ||
                afterActivation !== 'portals' ||
                pressedAfterActivation !== 'true'
              ) {
                failed = true;
              }
              await context.close();
            }

            await writeFile(
              path.join(out, 'viewport-matrix.json'),
              JSON.stringify(report, null, 2),
            );
            await writeFile(
              path.join(out, 'console-page-errors.json'),
              JSON.stringify(report.map(({ width, consoleErrors, pageErrors }) => ({ width, consoleErrors, pageErrors })), null, 2),
            );
            await browser.close();
            if (failed) process.exit(1);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/home-r3-capture.cjs"
          }

          set +e
          capture_home 2>&1 | tee "$EVIDENCE_DIR/logs/home-temporary-capture.log"
          HOME_CAPTURE_RC=${PIPESTATUS[0]}
          set -e
          echo "home-temporary-capture=${HOME_CAPTURE_RC}" >> "$EVIDENCE_DIR/command-status.txt"

          if [[ -d test-results ]]; then
            cp -a test-results "$EVIDENCE_DIR/test-results"
          fi

          ! grep -Eq '=[1-9][0-9]*$' "$EVIDENCE_DIR/command-status.txt"

      - name: Summarize HOME outcomes
        if: github.event_name == 'push' && always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.home_gate.outcome }}
          NODE_OUTCOME: ${{ steps.home_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.home_validation.outcome }}
        run: |
          {
            echo 'classification=REFERENCE_ONLY'
            echo "tested_sha=$HOME_SHA"
            echo "r3_parent=$HOME_R3_PARENT"
            echo "frozen_base=$HOME_BASE"
            echo "checkout=$CHECKOUT_OUTCOME"
            echo "identity_ancestry_delta_boundary=$GATE_OUTCOME"
            echo "node_setup=$NODE_OUTCOME"
            echo "validation=$VALIDATION_OUTCOME"
            if [[ -f "$EVIDENCE_DIR/w08b-reference-only-status.txt" ]]; then
              grep '^classification=' "$EVIDENCE_DIR/w08b-reference-only-status.txt" | sed 's/^/w08b_/'
            fi
          } > "$EVIDENCE_DIR/summary.txt"

      - name: Upload HOME reference-only evidence
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-home-exact-head-reference-only-5acba33a23c3424dbdfbfd5ef8bc94a6f7fe494a
          path: /tmp/gs-home-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce HOME job conclusion
        if: github.event_name == 'push' && always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.home_gate.outcome }}
          NODE_OUTCOME: ${{ steps.home_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.home_validation.outcome }}
        run: |
          test "$CHECKOUT_OUTCOME" = success
          test "$GATE_OUTCOME" = success
          test "$NODE_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success

  w02:
    name: W02 M01 exact candidate R2
    # W02 already validated: run 32183936131, job 95863135578. Preserve logic below without rerunning it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      W02_SHA: 7be4283ed9c65f0f2687f0e08ac4f3d45334cbfb
      W02_R2_PARENT: 1ca530a508537b02268a478fb9c0fa8fcdfc3175
      W02_BASELINE: 3572f1add5214414c0abb77a59a7f71703633f6b
      EVIDENCE_DIR: /tmp/gs-w02-evidence
    steps:
      - name: Initialize W02 evidence
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots"
          cat > "$EVIDENCE_DIR/manifest.txt" <<'EOF'
          classification=REFERENCE_ONLY
          workstream=GS-GOV-W11-HOME-W02-EXACT-HEAD-VALIDATION-R1
          revision=R2
          target=W02_M01
          required_widths=1440,768,430,390
          primary_runtime_contract=tests/visual/solutions/solutions-workspace.visual.spec.ts
          EOF

      - name: Check out exact W02 M01 R2 candidate
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: 7be4283ed9c65f0f2687f0e08ac4f3d45334cbfb
          fetch-depth: 0
          persist-credentials: false

      - name: Verify W02 identity ancestry deltas blobs and zero binary mutation
        id: w02_gate
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_head=$W02_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
            echo "expected_r2_parent=$W02_R2_PARENT"
            echo "actual_parent=$(git rev-parse HEAD^)"
            echo "governed_baseline=$W02_BASELINE"
            echo "merge_base=$(git merge-base "$W02_BASELINE" "$W02_SHA")"
          } | tee "$EVIDENCE_DIR/exact-checkout-identity.txt"

          test "$(git rev-parse HEAD)" = "$W02_SHA"
          test "$(git rev-parse HEAD^)" = "$W02_R2_PARENT"
          test "$(git merge-base "$W02_BASELINE" "$W02_SHA")" = "$W02_BASELINE"
          test "$(git rev-list --count "$W02_R2_PARENT..$W02_SHA")" -eq 1

          read -r behind ahead < <(git rev-list --left-right --count "$W02_BASELINE...$W02_SHA")
          {
            echo "behind=$behind"
            echo "ahead=$ahead"
          } | tee "$EVIDENCE_DIR/baseline-ahead-behind.txt"
          test "$behind" -eq 0
          test "$ahead" -eq 2

          cat > "$EVIDENCE_DIR/expected-r2-paths.txt" <<'EOF'
          tests/visual/solutions/solutions-workspace.visual.spec.ts
          EOF
          git diff --name-only "$W02_R2_PARENT...$W02_SHA" | sort | tee "$EVIDENCE_DIR/actual-r2-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-r2-paths.txt" "$EVIDENCE_DIR/actual-r2-paths.txt" | tee "$EVIDENCE_DIR/r2-path-verification.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-r2-paths.txt")" -eq 1
          git diff --stat "$W02_R2_PARENT...$W02_SHA" | tee "$EVIDENCE_DIR/r2-stat.txt"
          git diff --numstat "$W02_R2_PARENT...$W02_SHA" | tee "$EVIDENCE_DIR/r2-numstat.txt"
          awk 'NF == 3 { if ($1 != 1 || $2 != 1 || $3 != "tests/visual/solutions/solutions-workspace.visual.spec.ts") exit 1; seen=1 } END { exit !seen }' "$EVIDENCE_DIR/r2-numstat.txt"

          cat > "$EVIDENCE_DIR/expected-cumulative-paths.txt" <<'EOF'
          src/data/visual/familyVisualAssets.ts
          src/features/solutions/SolutionsExploration.tsx
          tests/visual/solutions/solutions-workspace.visual.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-cumulative-paths.txt" "$EVIDENCE_DIR/expected-cumulative-paths.txt"
          git diff --name-only "$W02_BASELINE...$W02_SHA" | sort | tee "$EVIDENCE_DIR/actual-cumulative-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-cumulative-paths.txt" "$EVIDENCE_DIR/actual-cumulative-paths.txt" | tee "$EVIDENCE_DIR/cumulative-path-verification.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-cumulative-paths.txt")" -eq 3
          git diff --stat "$W02_BASELINE...$W02_SHA" | tee "$EVIDENCE_DIR/cumulative-stat.txt"
          git diff --numstat "$W02_BASELINE...$W02_SHA" | tee "$EVIDENCE_DIR/cumulative-numstat.txt"

          if awk '$1 == "-" && $2 == "-" { found=1 } END { exit !found }' "$EVIDENCE_DIR/cumulative-numstat.txt"; then
            echo 'Binary mutation detected.' >&2
            exit 1
          fi
          if git diff --name-only "$W02_BASELINE...$W02_SHA" | grep -Eiq '\.(webp|png|jpe?g|gif|avif|ico|woff2?|ttf|otf|mp4|webm)$'; then
            echo 'Binary/WebP asset path mutation detected.' >&2
            exit 1
          fi
          echo 'zero_binary_webp_mutation=verified' > "$EVIDENCE_DIR/zero-binary-mutation.txt"

          : > "$EVIDENCE_DIR/product-blob-preservation.txt"
          for path in src/data/visual/familyVisualAssets.ts src/features/solutions/SolutionsExploration.tsx; do
            parent_blob="$(git rev-parse "$W02_R2_PARENT:$path")"
            head_blob="$(git rev-parse "$W02_SHA:$path")"
            {
              echo "path=$path"
              echo "previous_m01_blob=$parent_blob"
              echo "r2_blob=$head_blob"
              if [[ "$parent_blob" = "$head_blob" ]]; then echo "equal=true"; else echo "equal=false"; fi
            } >> "$EVIDENCE_DIR/product-blob-preservation.txt"
            test "$parent_blob" = "$head_blob"
          done

          git show "$W02_SHA:tests/visual/solutions/solutions-workspace.visual.spec.ts" \
            | grep -F "getByText('عمل الفريق والطلبات والسجلات', { exact: true })" \
            | tee "$EVIDENCE_DIR/exact-selector-correction.txt"

          test -f tests/visual/solutions/playwright.config.ts
          sha256sum tests/visual/solutions/playwright.config.ts \
            | tee "$EVIDENCE_DIR/governed-solutions-playwright-config.sha256"

      - name: Set up Node 20 for W02
        id: w02_node
        if: steps.w02_gate.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute W02 R2 validation contract
        id: w02_validation
        if: steps.w02_gate.outcome == 'success' && steps.w02_node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/command-status.txt"

          run_logged() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE_DIR/logs/${label}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}=${rc}" >> "$EVIDENCE_DIR/command-status.txt"
            LAST_RC=$rc
          }

          run_logged git-diff-check git diff --check "$W02_BASELINE...$W02_SHA"
          run_logged npm-ci npm ci
          run_logged lint npm run lint
          run_logged typecheck npm run typecheck
          run_logged build npm run build
          run_logged playwright-install npx playwright install chromium

          run_logged solutions-workspace npx playwright test \
            tests/visual/solutions/solutions-workspace.visual.spec.ts \
            --config=tests/visual/solutions/playwright.config.ts \
            --project=chromium \
            --workers=1
          W02_TEST_RC=$LAST_RC

          if [[ "$W02_TEST_RC" -ne 0 ]]; then
            run_logged solutions-workspace-trace-rerun npx playwright test \
              tests/visual/solutions/solutions-workspace.visual.spec.ts \
              --config=tests/visual/solutions/playwright.config.ts \
              --project=chromium \
              --workers=1 \
              --trace=retain-on-failure
          fi

          if [[ -d tests/visual/solutions/evidence/final-public-w02 ]]; then
            cp -a tests/visual/solutions/evidence/final-public-w02/. "$EVIDENCE_DIR/screenshots/"
          fi

          required=(
            w02-recognition-1440.png
            w02-booking-product-directions-context-1440.png
            w02-reference-unavailable-1440.png
            w02-reference-available-non-booking-commerce-1440.png
            w02-keyboard-focus.png
            w02-start-direct-handoff.png
            w02-escape-hatch-handoff.png
            w02-1440-selected-booking.png
            w02-768-selected-booking.png
            w02-430-selected-booking.png
            w02-390-selected-booking.png
            w02-1440-compare.png
            w02-768-compare.png
            w02-430-compare.png
            w02-390-compare.png
          )
          SCREENSHOT_RC=0
          for file in "${required[@]}"; do
            test -s "$EVIDENCE_DIR/screenshots/$file" || SCREENSHOT_RC=1
          done
          printf '%s\n' "${required[@]}" > "$EVIDENCE_DIR/required-screenshot-index.txt"
          cat > "$EVIDENCE_DIR/viewport-matrix.txt" <<'EOF'
          1440: selected + compare + governed 1440 proof surfaces
          768: selected + compare
          430: selected + compare
          390: selected + compare
          EOF
          echo "verify-w02-screenshots=${SCREENSHOT_RC}" >> "$EVIDENCE_DIR/command-status.txt"

          cat > "$EVIDENCE_DIR/primary-runtime-contract.txt" <<'EOF'
          Primary gating runtime contract:
          tests/visual/solutions/solutions-workspace.visual.spec.ts
          Governed config:
          tests/visual/solutions/playwright.config.ts

          The committed suite gates:
          six EMBLEM bindings; FAM-03-CMP-01; FAM-05-CMP-01; FAM-03-MSC-01;
          FAM-03-DIR-*; FAM-03-CTX-01/02; reference unavailable/available truth;
          START direct handoff; Escape Hatch; keyboard focus; compare state;
          RTL through the governed fixture; horizontal overflow; console errors; page errors.
          EOF

          auxiliary_runtime_audit() {
            npx vite tests/visual/fixtures/solutions --host 127.0.0.1 --port 4182 \
              > "$EVIDENCE_DIR/logs/w02-auxiliary-server.log" 2>&1 &
            local pid=$!
            local ready=0
            trap 'kill "$pid" 2>/dev/null || true' RETURN
            for _ in $(seq 1 35); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo 'auxiliary_server_state=EXITED_REFERENCE_ONLY' > "$EVIDENCE_DIR/auxiliary-audit-status.txt"
                cat "$EVIDENCE_DIR/logs/w02-auxiliary-server.log" >&2 || true
                return 0
              fi
              if curl -fsS http://127.0.0.1:4182/ >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              echo 'auxiliary_server_state=HEALTH_TIMEOUT_REFERENCE_ONLY' > "$EVIDENCE_DIR/auxiliary-audit-status.txt"
              return 0
            fi

            cat > "$RUNNER_TEMP/w02-r2-runtime-audit.cjs" <<'NODE'
          const { chromium } = require('@playwright/test');
          const { writeFile } = require('node:fs/promises');
          const path = require('node:path');

          const initial = [
            'FAM-01-EMB-01', 'FAM-02-EMB-01', 'FAM-03-EMB-01',
            'FAM-04-EMB-01', 'FAM-05-EMB-01', 'FAM-06-EMB-01',
            'FAM-03-MSC-01',
            'FAM-03-DIR-01', 'FAM-03-DIR-02', 'FAM-03-DIR-03',
            'FAM-03-CTX-01', 'FAM-03-CTX-02',
          ];
          const compare = ['FAM-03-CMP-01', 'FAM-05-CMP-01'];

          async function inspect(page, id) {
            const loc = page.locator(`[data-asset-id="${id}"]`).first();
            if (!(await loc.count())) return { id, ok: false, reason: 'missing' };
            return loc.evaluate((el, assetId) => {
              const img = el instanceof HTMLImageElement ? el : el.querySelector('img');
              if (!img) return { id: assetId, ok: false, reason: 'no-image' };
              return {
                id: assetId,
                ok: img.complete && img.naturalWidth > 0 && img.naturalHeight > 0,
                src: img.currentSrc || img.src,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
              };
            }, id);
          }

          (async () => {
            const out = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const report = { viewports: [], assets: [], contradiction: false };

            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 1000;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (m) => {
                if (m.type() === 'error') consoleErrors.push(m.text());
              });
              page.on('pageerror', (e) => pageErrors.push(e.message));

              await page.goto('http://127.0.0.1:4182/', { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const state = await page.evaluate(() => ({
                direction: getComputedStyle(document.querySelector('#solutions-exploration')).direction,
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));
              report.viewports.push({ width, height, ...state, consoleErrors, pageErrors });

              if (
                state.direction !== 'rtl' ||
                state.scrollWidth > state.clientWidth + 1 ||
                consoleErrors.length ||
                pageErrors.length
              ) {
                report.contradiction = true;
              }

              if (width === 1440) {
                for (const id of initial) {
                  const result = await inspect(page, id);
                  report.assets.push(result);
                  if (!result.ok) report.contradiction = true;
                }
                await page.getByRole('button', { name: 'قارن الحجوزات بالتشغيل' }).click();
                for (const id of compare) {
                  const result = await inspect(page, id);
                  report.assets.push(result);
                  if (!result.ok) report.contradiction = true;
                }
              }
              await context.close();
            }

            await writeFile(
              path.join(out, 'runtime-asset-and-viewport-audit.json'),
              JSON.stringify(report, null, 2),
            );
            await browser.close();
          })().catch(async (error) => {
            try {
              await writeFile(
                path.join(process.env.EVIDENCE_DIR, 'auxiliary-audit-execution-error.txt'),
                String(error && error.stack ? error.stack : error),
              );
            } catch {}
            process.exit(2);
          });
          NODE

            set +e
            node "$RUNNER_TEMP/w02-r2-runtime-audit.cjs" \
              > "$EVIDENCE_DIR/logs/w02-auxiliary-runtime-audit.log" 2>&1
            local audit_rc=$?
            set -e

            if [[ "$audit_rc" -ne 0 ]]; then
              echo "auxiliary_execution_state=ERROR_REFERENCE_ONLY rc=$audit_rc" > "$EVIDENCE_DIR/auxiliary-audit-status.txt"
              return 0
            fi

            if node -e "const r=require(process.env.EVIDENCE_DIR + '/runtime-asset-and-viewport-audit.json'); process.exit(r.contradiction ? 0 : 1)"; then
              echo 'auxiliary_execution_state=DIRECT_CONTRADICTION' > "$EVIDENCE_DIR/auxiliary-audit-status.txt"
              return 3
            fi

            echo 'auxiliary_execution_state=PASS_REFERENCE_ONLY' > "$EVIDENCE_DIR/auxiliary-audit-status.txt"
            return 0
          }

          set +e
          auxiliary_runtime_audit
          AUX_RC=$?
          set -e
          if [[ "$AUX_RC" -eq 3 ]]; then
            echo "w02-auxiliary-direct-contradiction=1" >> "$EVIDENCE_DIR/command-status.txt"
          else
            echo "w02-auxiliary-direct-contradiction=0" >> "$EVIDENCE_DIR/command-status.txt"
          fi

          if [[ -d test-results ]]; then
            cp -a test-results "$EVIDENCE_DIR/test-results"
          fi

          if [[ "$W02_TEST_RC" -eq 0 ]]; then
            cat > "$EVIDENCE_DIR/console-page-errors.txt" <<'EOF'
          Governed Solutions suite completed successfully.
          Its committed beforeEach/afterEach runtime contract fails on any captured console error or page error.
          See solutions-workspace.log and the committed suite source identity in the artifact.
          EOF
          fi

          ! grep -Eq '=[1-9][0-9]*$' "$EVIDENCE_DIR/command-status.txt"

      - name: Summarize W02 outcomes
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.w02_gate.outcome }}
          NODE_OUTCOME: ${{ steps.w02_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.w02_validation.outcome }}
        run: |
          {
            echo 'classification=REFERENCE_ONLY'
            echo "tested_sha=$W02_SHA"
            echo "r2_parent=$W02_R2_PARENT"
            echo "governed_baseline=$W02_BASELINE"
            echo 'repo_native_config=tests/visual/solutions/playwright.config.ts'
            echo "checkout=$CHECKOUT_OUTCOME"
            echo "identity_ancestry_delta_boundary_binary=$GATE_OUTCOME"
            echo "node_setup=$NODE_OUTCOME"
            echo "validation=$VALIDATION_OUTCOME"
            if [[ -f "$EVIDENCE_DIR/auxiliary-audit-status.txt" ]]; then
              cat "$EVIDENCE_DIR/auxiliary-audit-status.txt"
            fi
          } > "$EVIDENCE_DIR/summary.txt"

      - name: Upload W02 reference-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-w02-m01-exact-head-reference-only-7be4283ed9c65f0f2687f0e08ac4f3d45334cbfb
          path: /tmp/gs-w02-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce W02 job conclusion
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.w02_gate.outcome }}
          NODE_OUTCOME: ${{ steps.w02_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.w02_validation.outcome }}
        run: |
          test "$CHECKOUT_OUTCOME" = success
          test "$GATE_OUTCOME" = success
          test "$NODE_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success