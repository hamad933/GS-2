name: GS HOME + W02 Exact-Head Validation

on:
  push:
    branches:
      - governance/gs-home-w02-exact-head-validation-r1

permissions:
  contents: read

jobs:
  home:
    name: HOME exact candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOME_SHA: c93aba57610c4e8b029307dd2474182262b7dace
      HOME_BASE: bef381bcebde8199f263e1be465c5b0010058f5d
      EVIDENCE_DIR: ${{ runner.temp }}/gs-home-evidence
      VISUAL_EVIDENCE_DIR: ${{ runner.temp }}/gs-home-evidence/repo-native
    steps:
      - name: Initialize HOME evidence
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/repo-native"

      - name: Check out exact HOME candidate
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: c93aba57610c4e8b029307dd2474182262b7dace
          fetch-depth: 0
          persist-credentials: false

      - name: Verify HOME identity and seven-path boundary
        id: home_gate
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_head=$HOME_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
            echo "frozen_base=$HOME_BASE"
          } | tee "$EVIDENCE_DIR/exact-checkout-identity.txt"
          test "$(git rev-parse HEAD)" = "$HOME_SHA"

          cat > "$EVIDENCE_DIR/expected-changed-paths.txt" <<'EOF'
          src/components/footer/Footer.remediation.css
          src/components/hero/LivingSystemHero.tsx
          src/components/sections/ReferenceProof.remediation.css
          src/components/sections/SolutionsUniverse.tsx
          src/components/sections/SystemAnatomy.remediation.css
          src/components/sections/SystemAnatomy.tsx
          tests/visual/home-public-routing/home-public-routing.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-changed-paths.txt" "$EVIDENCE_DIR/expected-changed-paths.txt"
          git diff --name-only "$HOME_BASE" "$HOME_SHA" | sort | tee "$EVIDENCE_DIR/actual-changed-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-changed-paths.txt" "$EVIDENCE_DIR/actual-changed-paths.txt" | tee "$EVIDENCE_DIR/changed-path-verification.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-changed-paths.txt")" -eq 7
          git diff --stat "$HOME_BASE" "$HOME_SHA" | tee "$EVIDENCE_DIR/changed-path-stat.txt"
          git diff --numstat "$HOME_BASE" "$HOME_SHA" | tee "$EVIDENCE_DIR/changed-path-numstat.txt"
          printf '%s\n' 'Hero K01-K04 targets 01-04 = NOT_FOUND_AFTER_INSPECTION; no recreation or substitution performed.' > "$EVIDENCE_DIR/hero-k01-k04-authority.txt"

      - name: Set up Node 20 for HOME
        id: home_node
        if: steps.home_gate.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute HOME validation contract
        id: home_validation
        if: steps.home_gate.outcome == 'success' && steps.home_node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/command-status.txt"

          run_logged() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE_DIR/logs/${label}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            printf '%s=%s\n' "$label" "$rc" >> "$EVIDENCE_DIR/command-status.txt"
            LAST_RC=$rc
          }

          run_logged git-diff-check git diff --check "$HOME_BASE" "$HOME_SHA"
          run_logged npm-ci npm ci
          run_logged lint npm run lint
          run_logged typecheck npm run typecheck
          run_logged build npm run build
          run_logged playwright-install npx playwright install --with-deps chromium

          run_logged home-public-routing npx playwright test \
            tests/visual/home-public-routing/home-public-routing.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1
          HOME_TEST_RC=$LAST_RC

          if [[ "$HOME_TEST_RC" -ne 0 ]]; then
            run_logged home-public-routing-trace-rerun npx playwright test \
              tests/visual/home-public-routing/home-public-routing.spec.ts \
              --config=playwright.config.ts \
              --project=chromium \
              --workers=1 \
              --trace=retain-on-failure
          fi

          if [[ -f tests/visual/home-public-routing/gs-pages-w08-b-home-truth.spec.ts ]]; then
            run_logged w08b-home-truth npx playwright test \
              tests/visual/home-public-routing/gs-pages-w08-b-home-truth.spec.ts \
              --project=chromium \
              --workers=1
          else
            echo 'w08b-home-truth=127' >> "$EVIDENCE_DIR/command-status.txt"
            echo 'Required repo-native W08-B regression is missing.' | tee "$EVIDENCE_DIR/logs/w08b-home-truth.log"
          fi

          run_logged public-site-integration npx playwright test \
            tests/visual/public-site.integration.spec.ts \
            --project=chromium \
            --workers=1

          capture_home() {
            npm run preview -- --host 127.0.0.1 --port 4173 > "$EVIDENCE_DIR/logs/home-preview.log" 2>&1 &
            local preview_pid=$!
            trap 'kill "$preview_pid" 2>/dev/null || true' RETURN
            for _ in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:4173/ >/dev/null

            cat > "$RUNNER_TEMP/home-capture.cjs" <<'NODE'
          const { createRequire } = require('node:module');
          const { writeFile } = require('node:fs/promises');
          const path = require('node:path');
          const req = createRequire(path.join(process.cwd(), 'package.json'));
          const { chromium } = req('@playwright/test');

          (async () => {
            const evidenceDir = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const report = [];
            const widths = [1440, 768, 430, 390];
            const sectionSelectors = {
              hero: '#hero',
              s02: '#solutions-universe',
              referenceProof: '#reference-proof',
              systemAnatomy: '#system-anatomy',
              footer: '.gs-footer',
            };
            let failed = false;

            for (const width of widths) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 1000;
              const context = await browser.newContext({ viewport: { width, height }, reducedMotion: 'reduce' });
              const page = await context.newPage();
              const errors = [];
              page.on('console', (message) => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
              page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);

              const base = await page.evaluate(() => ({
                htmlDir: document.documentElement.dir,
                computedDir: getComputedStyle(document.documentElement).direction,
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
              }));
              const stages = [];
              const wall = page.locator('#hero .e2-operating-wall');
              stages.push({ stage: await page.locator('#hero').getAttribute('data-stage'), ariaLabel: await wall.getAttribute('aria-label') });

              await page.screenshot({ path: path.join(evidenceDir, 'screenshots', `home-${width}-full.png`), fullPage: true });
              for (const [name, selector] of Object.entries(sectionSelectors)) {
                const locator = page.locator(selector);
                await locator.screenshot({ path: path.join(evidenceDir, 'screenshots', `home-${width}-${name}.png`) });
              }

              const hero = page.locator('#hero');
              await hero.getByRole('button', { name: 'إطلاق خدمة رقمية', exact: true }).click();
              stages.push({ stage: await hero.getAttribute('data-stage'), ariaLabel: await wall.getAttribute('aria-label') });
              await hero.screenshot({ path: path.join(evidenceDir, 'screenshots', `home-${width}-hero-direction.png`) });
              await hero.getByRole('button', { name: 'خطوة رئيسية واحدة' }).click();
              stages.push({ stage: await hero.getAttribute('data-stage'), ariaLabel: await wall.getAttribute('aria-label') });
              await hero.screenshot({ path: path.join(evidenceDir, 'screenshots', `home-${width}-hero-build.png`) });
              for (const action of ['رتّب الرحلة حول الهدف', 'وحّد التجربة', 'جرّب المسار']) {
                await hero.getByRole('button', { name: action, exact: true }).click();
              }
              await hero.getByLabel('طلبك المختصر', { exact: true }).fill('Exact-head HOME evidence capture');
              await hero.getByRole('button', { name: 'جهّز الملخّص', exact: true }).click();
              stages.push({ stage: await hero.getAttribute('data-stage'), ariaLabel: await wall.getAttribute('aria-label') });
              await hero.screenshot({ path: path.join(evidenceDir, 'screenshots', `home-${width}-hero-launch.png`) });

              const entry = { width, height, ...base, stages, errors };
              report.push(entry);
              if (base.scrollWidth > base.clientWidth + 1 || base.computedDir !== 'rtl' || !base.reducedMotion || errors.length) failed = true;
              await context.close();
            }

            await writeFile(path.join(evidenceDir, 'viewport-evidence.json'), JSON.stringify(report, null, 2));
            await browser.close();
            if (failed) process.exit(1);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

            node "$RUNNER_TEMP/home-capture.cjs"
          }

          set +e
          capture_home 2>&1 | tee "$EVIDENCE_DIR/logs/home-temporary-capture.log"
          CAPTURE_RC=${PIPESTATUS[0]}
          set -e
          printf 'home-temporary-capture=%s\n' "$CAPTURE_RC" >> "$EVIDENCE_DIR/command-status.txt"

          if [[ -d test-results ]]; then
            cp -a test-results "$EVIDENCE_DIR/test-results"
          fi

          if grep -Eq '=[1-9][0-9]*$' "$EVIDENCE_DIR/command-status.txt"; then
            exit 1
          fi

      - name: Summarize HOME outcomes
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.home_gate.outcome }}
          NODE_OUTCOME: ${{ steps.home_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.home_validation.outcome }}
        run: |
          {
            echo "classification=REFERENCE_ONLY"
            echo "tested_sha=$HOME_SHA"
            echo "frozen_base=$HOME_BASE"
            echo "checkout=$CHECKOUT_OUTCOME"
            echo "identity_and_boundary=$GATE_OUTCOME"
            echo "node_setup=$NODE_OUTCOME"
            echo "validation=$VALIDATION_OUTCOME"
            echo "hero_k01_k04=NOT_FOUND_AFTER_INSPECTION"
          } > "$EVIDENCE_DIR/summary.txt"

      - name: Upload HOME reference-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs-home-exact-head-reference-only-c93aba57610c4e8b029307dd2474182262b7dace
          path: ${{ runner.temp }}/gs-home-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce HOME job conclusion
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.home_gate.outcome }}
          NODE_OUTCOME: ${{ steps.home_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.home_validation.outcome }}
        run: |
          test "$CHECKOUT_OUTCOME" = success
          test "$GATE_OUTCOME" = success
          test "$NODE_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success

  w02:
    name: W02 M01 exact candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      W02_SHA: 1ca530a508537b02268a478fb9c0fa8fcdfc3175
      W02_PARENT: 3572f1add5214414c0abb77a59a7f71703633f6b
      EVIDENCE_DIR: ${{ runner.temp }}/gs-w02-evidence
    steps:
      - name: Initialize W02 evidence
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots"

      - name: Check out exact W02 candidate
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: 1ca530a508537b02268a478fb9c0fa8fcdfc3175
          fetch-depth: 0
          persist-credentials: false

      - name: Verify W02 identity parent boundary and zero binary mutation
        id: w02_gate
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_head=$W02_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
            echo "expected_parent=$W02_PARENT"
            echo "actual_parent=$(git rev-parse HEAD^)"
          } | tee "$EVIDENCE_DIR/exact-checkout-identity.txt"
          test "$(git rev-parse HEAD)" = "$W02_SHA"
          test "$(git rev-parse HEAD^)" = "$W02_PARENT"

          cat > "$EVIDENCE_DIR/expected-changed-paths.txt" <<'EOF'
          src/data/visual/familyVisualAssets.ts
          src/features/solutions/SolutionsExploration.tsx
          tests/visual/solutions/solutions-workspace.visual.spec.ts
          EOF
          sort -o "$EVIDENCE_DIR/expected-changed-paths.txt" "$EVIDENCE_DIR/expected-changed-paths.txt"
          git diff --name-only "$W02_PARENT" "$W02_SHA" | sort | tee "$EVIDENCE_DIR/actual-changed-paths.txt"
          diff -u "$EVIDENCE_DIR/expected-changed-paths.txt" "$EVIDENCE_DIR/actual-changed-paths.txt" | tee "$EVIDENCE_DIR/changed-path-verification.diff"
          test "$(wc -l < "$EVIDENCE_DIR/actual-changed-paths.txt")" -eq 3
          git diff --stat "$W02_PARENT" "$W02_SHA" | tee "$EVIDENCE_DIR/changed-path-stat.txt"
          git diff --numstat "$W02_PARENT" "$W02_SHA" | tee "$EVIDENCE_DIR/changed-path-numstat.txt"
          if git diff --numstat "$W02_PARENT" "$W02_SHA" | awk '$1 == "-" && $2 == "-" { found=1 } END { exit !found }'; then
            echo 'Binary mutation detected.' >&2
            exit 1
          fi
          if git diff --name-only "$W02_PARENT" "$W02_SHA" | grep -Eiq '\.(webp|png|jpe?g|gif|avif|ico|woff2?|ttf|otf|mp4|webm)$'; then
            echo 'Asset-binary path mutation detected.' >&2
            exit 1
          fi
          echo 'zero_asset_binary_mutation=verified' > "$EVIDENCE_DIR/asset-binary-verification.txt"
          test -f tests/visual/solutions/playwright.config.ts
          sha256sum tests/visual/solutions/playwright.config.ts | tee "$EVIDENCE_DIR/repo-native-solutions-playwright-config.sha256"

      - name: Set up Node 20 for W02
        id: w02_node
        if: steps.w02_gate.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute W02 M01 validation contract
        id: w02_validation
        if: steps.w02_gate.outcome == 'success' && steps.w02_node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/command-status.txt"

          run_logged() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE_DIR/logs/${label}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            printf '%s=%s\n' "$label" "$rc" >> "$EVIDENCE_DIR/command-status.txt"
            LAST_RC=$rc
          }

          run_logged git-diff-check git diff --check "$W02_PARENT" "$W02_SHA"
          run_logged npm-ci npm ci
          run_logged lint npm run lint
          run_logged typecheck npm run typecheck
          run_logged build npm run build
          run_logged playwright-install npx playwright install --with-deps chromium

          run_logged solutions-workspace npx playwright test \
            tests/visual/solutions/solutions-workspace.visual.spec.ts \
            --config=tests/visual/solutions/playwright.config.ts \
            --project=chromium \
            --workers=1
          W02_TEST_RC=$LAST_RC

          if [[ "$W02_TEST_RC" -ne 0 ]]; then
            run_logged solutions-workspace-trace-rerun npx playwright test \
              tests/visual/solutions/solutions-workspace.visual.spec.ts \
              --config=tests/visual/solutions/playwright.config.ts \
              --project=chromium \
              --workers=1 \
              --trace=retain-on-failure
          fi

          if [[ -d tests/visual/solutions/evidence/final-public-w02 ]]; then
            cp -a tests/visual/solutions/evidence/final-public-w02/. "$EVIDENCE_DIR/screenshots/"
          fi

          verify_w02_screenshots() {
            local required=(
              w02-recognition-1440.png
              w02-booking-product-directions-context-1440.png
              w02-reference-unavailable-1440.png
              w02-reference-available-non-booking-commerce-1440.png
              w02-keyboard-focus.png
              w02-start-direct-handoff.png
              w02-escape-hatch-handoff.png
              w02-1440-selected-booking.png
              w02-768-selected-booking.png
              w02-430-selected-booking.png
              w02-390-selected-booking.png
              w02-1440-compare.png
              w02-768-compare.png
              w02-430-compare.png
              w02-390-compare.png
            )
            for file in "${required[@]}"; do
              test -s "$EVIDENCE_DIR/screenshots/$file"
            done
            printf '%s\n' "${required[@]}" > "$EVIDENCE_DIR/required-screenshot-index.txt"
          }
          set +e
          verify_w02_screenshots 2>&1 | tee "$EVIDENCE_DIR/logs/verify-w02-screenshots.log"
          SCREENSHOT_RC=${PIPESTATUS[0]}
          set -e
          printf 'verify-w02-screenshots=%s\n' "$SCREENSHOT_RC" >> "$EVIDENCE_DIR/command-status.txt"

          audit_w02_runtime() {
            npx vite tests/visual/fixtures/solutions --host 127.0.0.1 --port 4182 > "$EVIDENCE_DIR/logs/w02-fixture-server.log" 2>&1 &
            local server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' RETURN
            for _ in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:4182/ >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:4182/ >/dev/null

            cat > "$RUNNER_TEMP/w02-runtime-audit.cjs" <<'NODE'
          const { createRequire } = require('node:module');
          const { writeFile } = require('node:fs/promises');
          const path = require('node:path');
          const req = createRequire(path.join(process.cwd(), 'package.json'));
          const { chromium } = req('@playwright/test');

          const requiredInitial = [
            'FAM-01-EMB-01', 'FAM-02-EMB-01', 'FAM-03-EMB-01',
            'FAM-04-EMB-01', 'FAM-05-EMB-01', 'FAM-06-EMB-01',
            'FAM-03-MSC-01', 'FAM-03-DIR-01', 'FAM-03-DIR-02', 'FAM-03-DIR-03',
            'FAM-03-CTX-01', 'FAM-03-CTX-02',
          ];
          const requiredCompare = ['FAM-03-CMP-01', 'FAM-05-CMP-01'];

          async function inspectAsset(page, id) {
            const locator = page.locator(`[data-asset-id="${id}"]`).first();
            const count = await locator.count();
            if (!count) return { id, ok: false, reason: 'missing-data-asset-id' };
            return locator.evaluate((element, assetId) => {
              const image = element instanceof HTMLImageElement ? element : element.querySelector('img');
              if (!image) return { id: assetId, ok: false, reason: 'no-image-element', tag: element.tagName };
              return {
                id: assetId,
                ok: image.complete && image.naturalWidth > 0 && image.naturalHeight > 0,
                complete: image.complete,
                naturalWidth: image.naturalWidth,
                naturalHeight: image.naturalHeight,
                src: image.currentSrc || image.src,
              };
            }, id);
          }

          (async () => {
            const evidenceDir = process.env.EVIDENCE_DIR;
            const browser = await chromium.launch({ headless: true });
            const report = { viewports: [], assets: [], responseErrors: [], runtimeErrors: [] };
            let failed = false;

            for (const width of [1440, 768, 430, 390]) {
              const height = width === 768 ? 1024 : width <= 430 ? 844 : 1000;
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              const runtimeErrors = [];
              const responseErrors = [];
              page.on('console', (message) => { if (message.type() === 'error') runtimeErrors.push(`console: ${message.text()}`); });
              page.on('pageerror', (error) => runtimeErrors.push(`pageerror: ${error.message}`));
              page.on('requestfailed', (request) => responseErrors.push(`requestfailed: ${request.url()} :: ${request.failure()?.errorText ?? 'unknown'}`));
              page.on('response', (response) => { if (response.status() >= 400) responseErrors.push(`http-${response.status()}: ${response.url()}`); });
              await page.goto('http://127.0.0.1:4182/', { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const viewport = await page.evaluate(() => {
                const root = document.documentElement;
                const exploration = document.querySelector('#solutions-exploration');
                return {
                  htmlDir: root.dir,
                  computedDirection: exploration ? getComputedStyle(exploration).direction : null,
                  clientWidth: root.clientWidth,
                  scrollWidth: root.scrollWidth,
                };
              });
              report.viewports.push({ width, height, ...viewport, runtimeErrors, responseErrors });
              if (viewport.scrollWidth > viewport.clientWidth + 1 || viewport.computedDirection !== 'rtl' || runtimeErrors.length || responseErrors.length) failed = true;

              if (width === 1440) {
                for (const id of requiredInitial) {
                  const result = await inspectAsset(page, id);
                  report.assets.push(result);
                  if (!result.ok) failed = true;
                }
                await page.getByRole('button', { name: 'قارن الحجوزات بالتشغيل' }).click();
                for (const id of requiredCompare) {
                  const result = await inspectAsset(page, id);
                  report.assets.push(result);
                  if (!result.ok) failed = true;
                }
              }
              report.runtimeErrors.push(...runtimeErrors);
              report.responseErrors.push(...responseErrors);
              await context.close();
            }

            await writeFile(path.join(evidenceDir, 'runtime-asset-and-viewport-audit.json'), JSON.stringify(report, null, 2));
            await browser.close();
            if (failed) process.exit(1);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

            node "$RUNNER_TEMP/w02-runtime-audit.cjs"
          }

          set +e
          audit_w02_runtime 2>&1 | tee "$EVIDENCE_DIR/logs/w02-runtime-audit.log"
          RUNTIME_RC=${PIPESTATUS[0]}
          set -e
          printf 'w02-runtime-audit=%s\n' "$RUNTIME_RC" >> "$EVIDENCE_DIR/command-status.txt"

          if [[ -d test-results ]]; then
            cp -a test-results "$EVIDENCE_DIR/test-results"
          fi

          if grep -Eq '=[1-9][0-9]*$' "$EVIDENCE_DIR/command-status.txt"; then
            exit 1
          fi

      - name: Summarize W02 outcomes
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GATE_OUTCOME: ${{ steps.w02_gate.outcome }}
          NODE_OUTCOME: ${{ steps.w02_node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.w02_validation.outcome }}
        run: |
          {
            echo "classification=REFERENCE_ONLY"
            echo "tested_sha=$W02_SHA"
            echo "expected_parent=$W02_PARENT"
            echo "repo_native_config=tests/visual/solutions/playwright.config.ts"
            echo "checkout=$CHECKOUT_OUTCOME"
            echo "identity_parent_boundary_binary=$GATE_OUTCOME"
            echo "node_setup=$NODE_OUTCOME"
            echo "validation=$VALIDATION_OUTCOME"
          } > "$EVIDENCE_DIR/summary.txt"

      - name: Upload W02 reference-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
