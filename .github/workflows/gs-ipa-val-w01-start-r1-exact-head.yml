name: GS IPA START exact command evidence

on:
  push:
    branches:
      - validation/gs-ipa-val-w01-start-r1-evidence

permissions:
  contents: write

jobs:
  core-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: d10cba74a7eb4103be4a2e285fff1c5732959043
      BASE_SHA: 19e9096d714cfaa0055cfa1ccc794ca26320a2c5
      VALIDATION_BRANCH: validation/gs-ipa-val-w01-start-r1-evidence
      PUBLISH_DIR: validation-evidence/gs-ipa-val-w01-start-r1/core-r2
    steps:
      - name: Checkout exact frozen head
        uses: actions/checkout@v4
        with:
          ref: d10cba74a7eb4103be4a2e285fff1c5732959043
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          mkdir -p evidence
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "BASE_SHA=$BASE_SHA"
            echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
            echo "MERGE_BASE=$(git merge-base "$BASE_SHA" "$TARGET_SHA")"
            echo "CHANGED_PATHS_BEGIN"
            git diff --name-only "$BASE_SHA...$TARGET_SHA"
            echo "CHANGED_PATHS_END"
          } | tee evidence/checkout.txt
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run required exact-head commands
        shell: bash
        run: |
          set +e
          git diff --check 2>&1 | tee evidence/git-diff-check.log
          echo "GIT_DIFF_CHECK=${PIPESTATUS[0]}" >> evidence/status.env

          git diff --check "$BASE_SHA...$TARGET_SHA" 2>&1 | tee evidence/git-diff-check-base-head.log
          echo "GIT_DIFF_CHECK_BASE_HEAD=${PIPESTATUS[0]}" >> evidence/status.env

          npm ci 2>&1 | tee evidence/npm-ci.log
          echo "NPM_CI=${PIPESTATUS[0]}" >> evidence/status.env

          npm run lint 2>&1 | tee evidence/lint.log
          echo "LINT=${PIPESTATUS[0]}" >> evidence/status.env

          npm run typecheck 2>&1 | tee evidence/typecheck.log
          echo "TYPECHECK=${PIPESTATUS[0]}" >> evidence/status.env

          npm run build 2>&1 | tee evidence/build.log
          echo "BUILD=${PIPESTATUS[0]}" >> evidence/status.env

          npx playwright install --with-deps chromium 2>&1 | tee evidence/chromium-install.log
          echo "CHROMIUM_INSTALL=${PIPESTATUS[0]}" >> evidence/status.env

          npx playwright --version 2>&1 | tee evidence/playwright-version.txt
          node --input-type=module - <<'NODE' 2>&1 | tee evidence/chromium-version.txt
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          console.log(browser.version());
          await browser.close();
          NODE
          echo "CHROMIUM_PROBE=${PIPESTATUS[0]}" >> evidence/status.env

          npx playwright test \
            --config=tests/visual/start-discovery/playwright.config.ts \
            --project=chromium \
            --workers=1 2>&1 | tee evidence/start-targeted-playwright.log
          echo "START_TARGETED_PLAYWRIGHT=${PIPESTATUS[0]}" >> evidence/status.env

          npx playwright test \
            --config=tests/visual/start-discovery/public-handoff.playwright.config.ts \
            --project=chromium \
            --workers=1 2>&1 | tee evidence/public-handoff-playwright.log
          echo "PUBLIC_HANDOFF_PLAYWRIGHT=${PIPESTATUS[0]}" >> evidence/status.env
          exit 0

      - name: Summarize exact command evidence
        if: always()
        shell: bash
        run: |
          {
            cat evidence/checkout.txt
            echo "STATUS_BEGIN"
            cat evidence/status.env
            echo "STATUS_END"
          } | tee evidence/validation-summary.txt

      - name: Persist exact command evidence
        if: always()
        shell: bash
        run: |
          cp -a evidence /tmp/gs-core-r2
          git reset --hard
          git clean -fdx
          git fetch origin "$VALIDATION_BRANCH"
          git checkout -B "$VALIDATION_BRANCH" "origin/$VALIDATION_BRANCH"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          cp -a /tmp/gs-core-r2/. "$PUBLISH_DIR/"
          git config user.name "gs-exact-head-validation"
          git config user.email "gs-exact-head-validation@users.noreply.github.com"
          git add -f "$PUBLISH_DIR"
          git commit -m "chore(validation): persist START exact command evidence r2" || true
          git push origin "HEAD:$VALIDATION_BRANCH"

      - name: Fail if any required command failed
        if: always()
        shell: bash
        run: |
          status_file="$PUBLISH_DIR/status.env"
          test -f "$status_file" || exit 1
          fail=0
          while IFS='=' read -r key value; do
            case "$key" in
              GIT_DIFF_CHECK|GIT_DIFF_CHECK_BASE_HEAD|NPM_CI|LINT|TYPECHECK|BUILD|CHROMIUM_INSTALL|CHROMIUM_PROBE|START_TARGETED_PLAYWRIGHT|PUBLIC_HANDOFF_PLAYWRIGHT)
                if [ "$value" != "0" ]; then echo "$key=$value"; fail=1; fi
                ;;
            esac
          done < "$status_file"
          exit "$fail"
