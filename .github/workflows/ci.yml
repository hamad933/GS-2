name: CI

on:
  push:
    branches:
      - codex/gs-gov-rebase-001

permissions:
  contents: write

jobs:
  repair-unused-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: codex/gs-gov-rebase-001

      - name: Apply bounded TypeScript import corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("src/components/hero/stages/DirectionStage.tsx"): [
                  ("import React, { Fragment, useState } from 'react';", "import { Fragment, useState } from 'react';"),
              ],
              Path("src/components/hero/stages/LaunchStage.tsx"): [
                  ("import React, { useState, useEffect, useCallback } from 'react';", "import { useState, useEffect, useCallback } from 'react';"),
                  ("import { RequestTag } from '../primitives/RequestTag';\n", ""),
              ],
              Path("src/components/sections/GoalBasedSection.tsx"): [
                  ("import React, { useState } from 'react';", "import { useState } from 'react';"),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"Expected import not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit bounded corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/hero/stages/DirectionStage.tsx src/components/hero/stages/LaunchStage.tsx src/components/sections/GoalBasedSection.tsx
          git diff --cached --check
          git commit -m "fix: remove remaining unused TypeScript imports"
          git push origin HEAD:codex/gs-gov-rebase-001
