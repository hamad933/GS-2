name: W07 Exact Evidence

on:
  pull_request:
    branches:
      - controller/gs-home-w05-v2-visual-authority
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/w07-exact-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact W07 candidate
        uses: actions/checkout@v4
        with:
          ref: 54d18e2625897482d018b17d2dc87ba0bb219639

      - name: Verify exact W07 SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "54d18e2625897482d018b17d2dc87ba0bb219639"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Homepage evidence
        env:
          VISUAL_EVIDENCE_DIR: visual-evidence/home
        run: npx playwright test tests/visual/hero.visual.spec.ts --project=chromium --workers=1

      - name: Capture full public-site evidence
        env:
          W05_EVIDENCE_DIR: visual-evidence/public-site
        run: npx playwright test tests/visual/public-site.evidence.spec.ts --project=chromium --workers=1

      - name: Verify evidence inventory
        shell: bash
        run: |
          count="$(find visual-evidence -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "PNG evidence count: $count"
          test "$count" -ge 40
          find visual-evidence -type f -name '*.png' -print | sort

      - name: Upload exact-head visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gs-w07-exact-visual-evidence-54d18e2625897482d018b17d2dc87ba0bb219639
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7
